<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisualMath.Lim - Latihan Trigonometri</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['$$', '$$']] },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea'] },
  startup: { typeset: false }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
<style>
  body { background:#022050; }
  mjx-container[display="true"] { overflow-x:auto; overflow-y:hidden; max-width:100%; padding:4px 0; }
  .opt:hover { border-color:#00d6d8; box-shadow:0 0 12px rgba(0,214,216,.35); }
  .glow { box-shadow:0 0 0 2px #00d6d8, 0 0 14px rgba(0,214,216,.6); }
  .scroll-x::-webkit-scrollbar { height:6px; }
  .scroll-x::-webkit-scrollbar-thumb { background:#00d6d8; border-radius:9px; }
  .prose-vm p { margin:.5rem 0; line-height:1.7; }
</style>
</head>
<body class="text-white min-h-screen font-sans">

<!-- NAVBAR -->
<header class="sticky top-0 z-30 bg-[#011836]/95 backdrop-blur border-b border-[#00d6d8]/30">
  <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <a href="index.html" title="Home" class="text-[#00d6d8] hover:text-white"><i class="fa-solid fa-house"></i></a>
      <h1 class="font-bold text-xs sm:text-base truncate">VisualMath.Lim - Latihan Trigonometri TKA SMA Kelas 12</h1>
    </div>
    <a href="trigonometri.html" class="shrink-0 flex items-center gap-2 border border-[#00d6d8] text-[#00d6d8] hover:bg-[#00d6d8] hover:text-black rounded-lg px-2 sm:px-3 py-1.5 text-xs sm:text-sm font-semibold transition">
      <img src="logo.png" alt="Logo" class="h-6 w-6 object-contain" onerror="this.style.display='none'">
      <span class="hidden sm:inline">Kembali ke Dashboard Trigonometri</span>
      <span class="sm:hidden">Dashboard</span>
    </a>
  </div>
</header>

<main id="app" class="max-w-7xl mx-auto p-3 sm:p-4"></main>

<script>
/* ============ UTIL SVG (gambar dibuat dengan kode, tanpa upload) ============ */
const svgURI = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

// Tangga + dinding. solved=false -> gambar soal; solved=true -> gambar pembahasan
function ladderSVG(solved) {
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" font-family="Arial" font-size="14">
  <rect x="250" y="10" width="50" height="200" fill="#64748b"/>
  <text x="275" y="30" fill="#fff" font-size="11" text-anchor="middle">dinding</text>
  <line x1="20" y1="210" x2="360" y2="210" stroke="#fff" stroke-width="3"/>
  <line x1="150" y1="210" x2="250" y2="36.8" stroke="#c98a4b" stroke-width="7"/>
  <line x1="150" y1="210" x2="250" y2="36.8" stroke="#f3d3a4" stroke-width="12" stroke-dasharray="2 13" opacity=".8"/>
  ${solved ? '<line x1="150" y1="210" x2="250" y2="210" stroke="#00d6d8" stroke-width="3" stroke-dasharray="6 4"/><line x1="250" y1="210" x2="250" y2="36.8" stroke="#ffd300" stroke-width="3"/>' : ''}
  <rect x="238" y="198" width="12" height="12" fill="none" stroke="#fff"/>
  <path d="M175 210 A25 25 0 0 0 162.5 188.35" fill="none" stroke="#ffd300" stroke-width="2"/>
  <text x="180" y="198" fill="#ffd300">60°</text>
  <text x="168" y="110" fill="#00d6d8" font-weight="bold" text-anchor="end">tangga 6 m</text>
  <text x="318" y="125" fill="#ffd300" font-weight="bold">${solved ? 't = 3√3 m' : 't = ?'}</text>
  ${solved ? '<text x="200" y="232" fill="#00d6d8" text-anchor="middle">jarak kaki = 3 m</text>' : ''}
  </svg>`);
}

// Sudut tumpul di Kuadran II
const quadSVG = svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="Arial" font-size="14">
  <line x1="20" y1="190" x2="400" y2="190" stroke="#fff" stroke-width="2"/>
  <line x1="260" y1="10" x2="260" y2="240" stroke="#fff" stroke-width="2"/>
  <text x="402" y="184" fill="#fff">x</text><text x="266" y="18" fill="#fff">y</text>
  <text x="30" y="30" fill="#00d6d8" font-weight="bold">Kuadran II</text>
  <text x="30" y="50" fill="#fff" font-size="12">sin A positif, cos A negatif</text>
  <polygon points="100,110 100,190 260,190" fill="#00d6d8" fill-opacity=".18"/>
  <line x1="260" y1="190" x2="100" y2="110" stroke="#ff6b6b" stroke-width="3"/>
  <line x1="100" y1="110" x2="100" y2="190" stroke="#4ade80" stroke-width="3"/>
  <line x1="100" y1="190" x2="260" y2="190" stroke="#00d6d8" stroke-width="3"/>
  <rect x="100" y="178" width="12" height="12" fill="none" stroke="#fff"/>
  <path d="M290 190 A30 30 0 0 0 233.2 176.6" fill="none" stroke="#ffd300" stroke-width="2"/>
  <text x="272" y="170" fill="#ffd300" font-weight="bold">A</text>
  <text x="70" y="104" fill="#fff" font-weight="bold">P(x, y)</text>
  <text x="165" y="136" fill="#ff6b6b" font-weight="bold">r = a</text>
  <text x="76" y="156" fill="#4ade80" font-weight="bold">y = 1</text>
  <text x="95" y="212" fill="#00d6d8" font-weight="bold">x = −√(a²−1)</text>
  </svg>`);

/* ============ DATA SOAL ============ */
const questions = [
  {
    id: 1,
    question_text: String.raw`Diketahui \(\sin A = \dfrac{1}{a}\), \(A\) adalah sudut tumpul. Nilai \(\cos A = \ldots\)`,
    image: '',
    options: {
      A: String.raw`\(\dfrac{a}{\sqrt{a^2+1}}\)`,
      B: String.raw`\(\dfrac{1}{\sqrt{a^2+1}}\)`,
      C: String.raw`\(\dfrac{\sqrt{a^2-1}}{a}\)`,
      D: String.raw`\(-\dfrac{\sqrt{a^2-1}}{a}\)`,
      E: String.raw`\(-\dfrac{\sqrt{a^2+1}}{a}\)`
    },
    correct_answer: 'D',
    pembahasan_image: quadSVG,
    pembahasan: String.raw`
<p><b>Langkah 1 - Letak sudut.</b> \(A\) tumpul (\(90^\circ < A < 180^\circ\)) berada di <b>Kuadran II</b>, sehingga \(\cos A\) <b>negatif</b>.</p>
<p><b>Langkah 2 - Ubah ke perbandingan sisi.</b> \(\sin A = \frac{y}{r} = \frac{1}{a}\), maka \(y = 1\) dan \(r = a\) (dengan \(a>1\)).</p>
<p><b>Langkah 3 - Pythagoras untuk mencari \(x\):</b></p>
$$\begin{aligned}
x^2 + y^2 &= r^2\\
x^2 + 1^2 &= a^2\\
x^2 &= a^2 - 1\\
x &= -\sqrt{a^2-1} \quad (\text{di Kuadran II, } x \text{ negatif})
\end{aligned}$$
<p><b>Langkah 4 - Hitung \(\cos A\):</b></p>
$$\cos A = \frac{x}{r} = \frac{-\sqrt{a^2-1}}{a} = -\frac{\sqrt{a^2-1}}{a}$$
<p><b>Cara alternatif (identitas):</b></p>
$$\begin{aligned}
\sin^2 A + \cos^2 A &= 1\\
\cos^2 A &= 1 - \frac{1}{a^2} = \frac{a^2-1}{a^2}\\
\cos A &= -\frac{\sqrt{a^2-1}}{a} \quad (\text{tanda negatif di Kuadran II})
\end{aligned}$$
<p><b>Jawaban: D.</b></p>`,
    cara_cepat: String.raw`
<p>1. Sudut tumpul: \(\cos A < 0\). Pilihan A, B, C bernilai positif, langsung <b>coret</b>.</p>
<p>2. Sisa D dan E. Dari \(\cos^2 A = 1-\sin^2 A\):</p>
$$\cos^2 A = \frac{a^2-1}{a^2} \;\Rightarrow\; \text{bentuk akar harus } \sqrt{a^2-1}\ (\text{bukan } \sqrt{a^2+1})$$
<p>Maka jawabannya <b>D</b>.</p>`
  },
  {
    id: 2,
    question_text: String.raw`Suatu tangga dengan panjang 6 meter disandarkan pada dinding vertikal. Sudut yang dibentuk tangga dengan lantai adalah \(60^\circ\). Tinggi dinding yang disentuh ujung atas tangga adalah \(\ldots\)`,
    image: ladderSVG(false),
    options: {
      A: String.raw`\(3\) meter`,
      B: String.raw`\(3\sqrt{2}\) meter`,
      C: String.raw`\(3\sqrt{3}\) meter`,
      D: String.raw`\(4\sqrt{2}\) meter`,
      E: String.raw`\(4\sqrt{3}\) meter`
    },
    correct_answer: 'C',
    pembahasan_image: ladderSVG(true),
    pembahasan: String.raw`
<p><b>Diketahui:</b> panjang tangga (sisi miring) = 6 m, sudut dengan lantai = \(60^\circ\). <b>Ditanya:</b> tinggi dinding \(t\) (sisi depan sudut \(60^\circ\)).</p>
<p><b>Langkah 1 - Pilih perbandingan.</b> Sisi miring diketahui dan sisi depan dicari, jadi gunakan sin (Sin-De-Mi):</p>
$$\sin 60^\circ = \frac{\text{depan}}{\text{miring}} = \frac{t}{6}$$
<p><b>Langkah 2 - Hitung \(t\):</b></p>
$$\begin{aligned}
t &= 6 \times \sin 60^\circ\\
&= 6 \times \tfrac{1}{2}\sqrt{3}\\
&= 3\sqrt{3}\ \text{meter}
\end{aligned}$$
<p><b>Cek dengan Pythagoras</b> (jarak kaki tangga \(= 6\cos 60^\circ = 3\) m):</p>
$$3^2 + \left(3\sqrt{3}\right)^2 = 9 + 27 = 36 = 6^2 \;\checkmark$$
<p><b>Jawaban: C</b> (\(\approx 5{,}2\) m).</p>`,
    cara_cepat: String.raw`
<p>Segitiga istimewa \(30^\circ\text{-}60^\circ\text{-}90^\circ\) memiliki perbandingan sisi:</p>
$$\text{depan } 30^\circ : \text{depan } 60^\circ : \text{miring} = 1 : \sqrt{3} : 2$$
<p>Sisi miring \(6 = 3\times 2\), jadi semua sisi dikali 3:</p>
$$t = 3\times\sqrt{3} = 3\sqrt{3}\ \text{m}$$
<p>Pengecoh: A (\(3\)) adalah jarak kaki tangga (tertukar cos); B memakai \(\sin 45^\circ\); E (\(\approx 6{,}93\)) lebih panjang dari tangga sehingga mustahil.</p>`
  }
];

/* ============ STATE ============ */
const $ = id => document.getElementById(id);
let cur = 0, answers = {}, seconds = 0, timer = null, finished = false;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const IMG_CLASS = 'max-w-full h-auto object-contain rounded-lg border border-gray-600 bg-white/10 p-2 my-4 block';

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([$('app')]).catch(() => {});
  else setTimeout(typeset, 300);
}
function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { seconds++; const el = $('sw'); if (el) el.textContent = fmt(seconds); }, 1000);
}

/* ============ STATE 1: MENGERJAKAN ============ */
function renderQuiz() {
  const q = questions[cur], N = questions.length, last = cur === N - 1;
  const done = Object.keys(answers).length;
  const navBtns = questions.map((x, i) => {
    const on = answers[x.id] !== undefined;
    return `<button onclick="go(${i})" class="shrink-0 w-11 h-11 rounded-lg font-bold border transition ${on ? 'bg-[#ffd300] text-black border-[#ffd300]' : 'bg-white/5 text-white border-white/30 hover:border-[#00d6d8]'} ${i === cur ? 'glow' : ''}">${i + 1}</button>`;
  }).join('');
  const opts = Object.entries(q.options).map(([k, v]) => {
    const sel = answers[q.id] === k;
    return `<label class="opt flex items-center gap-3 w-full p-3 sm:p-4 rounded-xl border cursor-pointer transition ${sel ? 'bg-[#00d6d8]/25 border-[#00d6d8]' : 'bg-white/5 border-white/20'}">
      <input type="radio" name="opt" class="hidden" ${sel ? 'checked' : ''} onchange="pick('${k}')">
      <span class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center font-bold ${sel ? 'bg-[#00d6d8] text-black' : 'bg-white/10'}">${k}</span>
      <span class="min-w-0 overflow-x-auto">${v}</span></label>`;
  }).join('');

  $('app').innerHTML = `
  <div class="grid lg:grid-cols-[3fr_1fr] gap-4 items-start">
    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-6 min-w-0">
      <div class="flex items-center justify-between mb-4">
        <span class="font-bold text-[#00d6d8]">Soal ${cur + 1} dari ${N}</span>
        <span class="bg-black/30 border border-[#00d6d8]/50 rounded-lg px-3 py-1 font-mono text-lg"><i class="fa-regular fa-clock mr-2 text-[#00d6d8]"></i><span id="sw">${fmt(seconds)}</span></span>
      </div>
      <div class="text-base sm:text-lg leading-relaxed overflow-x-auto">${q.question_text}</div>
      ${q.image ? `<img src="${q.image}" alt="Gambar soal ${cur + 1}" class="${IMG_CLASS}">` : ''}
      <div class="space-y-3 mt-4">${opts}</div>
      <div id="warn" class="hidden mt-4 p-3 rounded-lg bg-[#ffd300]/15 border border-[#ffd300] text-[#ffd300] text-sm"></div>
      <div class="flex justify-between gap-3 mt-6">
        <button onclick="go(cur-1)" ${cur === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-lg border border-[#00d6d8] text-[#00d6d8] font-semibold hover:bg-[#00d6d8] hover:text-black transition disabled:opacity-30 disabled:pointer-events-none"><i class="fa-solid fa-chevron-left mr-2"></i>Sebelumnya</button>
        ${last
          ? `<button onclick="finish()" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selesai &amp; Lihat Pembahasan<i class="fa-solid fa-flag-checkered ml-2"></i></button>`
          : `<button onclick="go(cur+1)" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selanjutnya<i class="fa-solid fa-chevron-right ml-2"></i></button>`}
      </div>
    </section>

    <aside class="bg-white/5 border border-white/10 rounded-2xl p-4 lg:sticky lg:top-20 min-w-0">
      <h2 class="font-bold mb-3 text-[#00d6d8]">Navigasi Soal</h2>
      <div class="scroll-x flex lg:flex-wrap gap-2 overflow-x-auto pb-2">${navBtns}</div>
      <p class="text-sm text-white/70 mt-2">Terjawab: <b class="text-[#ffd300]">${done}</b> / ${N}</p>
      <div class="mt-3 text-xs text-white/80 bg-[#00d6d8]/10 border border-[#00d6d8]/40 rounded-lg p-3">
        <i class="fa-solid fa-circle-info text-[#00d6d8] mr-1"></i>
        Semua soal harus dikerjakan. Jika masih ada yang kosong, latihan tidak bisa diselesaikan dan pembahasan belum dapat dibuka.
      </div>
      <button onclick="finish()" class="mt-3 w-full px-3 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selesai &amp; Lihat Pembahasan</button>
    </aside>
  </div>`;
  typeset();
}
function go(i) { if (i < 0 || i >= questions.length) return; cur = i; renderQuiz(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function pick(k) { answers[questions[cur].id] = k; renderQuiz(); }
function finish() {
  const empty = questions.map((q, i) => answers[q.id] === undefined ? i + 1 : null).filter(Boolean);
  if (empty.length) {
    const w = $('warn');
    w.classList.remove('hidden');
    w.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Belum bisa selesai. Soal nomor <b>${empty.join(', ')}</b> belum dijawab. Kerjakan semua soal dulu, lalu klik "Selesai &amp; Lihat Pembahasan".`;
    w.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  clearInterval(timer); finished = true; renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ STATE 2: PEMBAHASAN & EVALUASI ============ */
function renderReview() {
  const N = questions.length;
  const benar = questions.filter(q => answers[q.id] === q.correct_answer).length;
  const salah = N - benar, skor = Math.round(benar / N * 100);
  const stat = (label, val, cls) => `<div class="bg-black/25 rounded-xl p-3 text-center"><div class="text-2xl sm:text-3xl font-extrabold ${cls}">${val}</div><div class="text-xs sm:text-sm text-white/70">${label}</div></div>`;

  const cards = questions.map((q, i) => {
    const mine = answers[q.id], ok = mine === q.correct_answer;
    const opts = Object.entries(q.options).map(([k, v]) => {
      let c = 'border-white/15 bg-white/5', tag = '';
      if (k === q.correct_answer) { c = 'border-green-400 bg-green-500/20'; tag = '<span class="ml-auto shrink-0 text-green-300 text-xs font-bold"><i class="fa-solid fa-check"></i> Kunci</span>'; }
      else if (k === mine) { c = 'border-red-400 bg-red-500/20'; tag = '<span class="ml-auto shrink-0 text-red-300 text-xs font-bold"><i class="fa-solid fa-xmark"></i> Jawabanmu</span>'; }
      if (k === mine && ok) tag = '<span class="ml-auto shrink-0 text-green-300 text-xs font-bold"><i class="fa-solid fa-check"></i> Jawabanmu (Benar)</span>';
      return `<div class="flex items-center gap-3 p-3 rounded-xl border ${c}"><span class="shrink-0 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold">${k}</span><span class="min-w-0 overflow-x-auto">${v}</span>${tag}</div>`;
    }).join('');
    return `
    <article class="bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-[#00d6d8]">Soal ${i + 1}</h3>
        <span class="px-3 py-1 rounded-full text-sm font-bold ${ok ? 'bg-green-500/25 text-green-300' : 'bg-red-500/25 text-red-300'}">${ok ? '<i class="fa-solid fa-circle-check"></i> Benar' : '<i class="fa-solid fa-circle-xmark"></i> Salah'}</span>
      </div>
      <div class="text-base sm:text-lg leading-relaxed overflow-x-auto">${q.question_text}</div>
      ${q.image ? `<img src="${q.image}" alt="Gambar soal ${i + 1}" class="${IMG_CLASS}">` : ''}
      <div class="space-y-2 mt-3">${opts}</div>
      <p class="mt-3 text-sm">Jawabanmu: <b class="${ok ? 'text-green-300' : 'text-red-300'}">${mine}</b> &nbsp;|&nbsp; Kunci: <b class="text-green-300">${q.correct_answer}</b></p>

      <div class="mt-5 rounded-xl border border-white/20 bg-[#011836] p-4 prose-vm">
        <h4 class="font-bold text-[#ffd300] mb-2"><i class="fa-solid fa-book-open mr-2"></i>Pembahasan Lengkap</h4>
        ${q.pembahasan_image ? `<img src="${q.pembahasan_image}" alt="Ilustrasi pembahasan ${i + 1}" class="${IMG_CLASS}">` : ''}
        ${q.pembahasan}
      </div>
      <div class="mt-4 rounded-xl border border-[#00d6d8]/60 bg-[#00d6d8]/10 p-4 prose-vm">
        <h4 class="font-bold text-[#00d6d8] mb-2">🔥 Cara Cepat / Trik</h4>
        ${q.cara_cepat}
      </div>
    </article>`;
  }).join('');

  $('app').innerHTML = `
  <section class="rounded-2xl p-5 sm:p-6 mb-5 bg-gradient-to-br from-[#00d6d8]/25 to-[#022050] border border-[#00d6d8]/60">
    <h2 class="text-xl sm:text-2xl font-extrabold mb-4"><i class="fa-solid fa-trophy text-[#ffd300] mr-2"></i>Ringkasan Hasil Latihan</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${stat('Skor Akhir', skor, 'text-[#ffd300]')}${stat('Total Benar', benar, 'text-green-300')}
      ${stat('Total Salah', salah, 'text-red-300')}${stat('Waktu Pengerjaan', fmt(seconds), 'text-[#00d6d8]')}
    </div>
    <div class="flex flex-wrap gap-3 mt-4">
      <button onclick="restart()" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110"><i class="fa-solid fa-rotate-right mr-2"></i>Ulangi Latihan</button>
      <a href="trigonometri.html" class="px-4 py-2 rounded-lg border border-[#00d6d8] text-[#00d6d8] font-semibold hover:bg-[#00d6d8] hover:text-black transition">Kembali ke Dashboard Trigonometri</a>
    </div>
  </section>
  <div class="space-y-5">${cards}</div>`;
  typeset();
}
function restart() { cur = 0; answers = {}; seconds = 0; finished = false; startTimer(); renderQuiz(); window.scrollTo({ top: 0 }); }

/* ============ INIT ============ */
renderQuiz();
startTimer();
</script>
</body>
</html>
