const PL=(x,y,l)=>F('-65 -65 130 130',200,[...Array(13)].map((_,i)=>`<path d="M${i*10-60} -60v120M-60 ${i*10-60}h120" style="stroke-opacity:.2;stroke-width:.5"/>`).join('')+'<path d="M-62 0H62M0 -62V62"/>'+`<circle cx="${x*10}" cy="${-y*10}" r="3.5" style="fill:#ffd300;stroke:none"/>`+T(x*10+6,-y*10+14,l));

const questions=[
{id:1,type:'single',
question_text:String.raw`Garis $g$ sejajar garis $h$ dan keduanya dipotong oleh sebuah garis lain seperti pada gambar (gambar tidak sesuai skala). Dua sudut yang ditandai berada di antara kedua garis sejajar pada sisi yang sama dari garis potong. Besar sudut yang dinyatakan dengan $(4x+20)^\circ$ adalah ....`,
image:F('0 0 250 170',300,'<line x1="10" y1="50" x2="240" y2="50"/><line x1="10" y1="120" x2="240" y2="120"/><line x1="70" y1="10" x2="150" y2="160"/><path d="M205 44l8 6-8 6M205 114l8 6-8 6"/>'+T(108,68,'(2x + 10)°')+T(136,108,'(4x + 20)°')+T(12,44,'g')+T(12,114,'h')),
options:{A:'$60^\\circ$',B:'$80^\\circ$',C:'$100^\\circ$',D:'$120^\\circ$',E:'$140^\\circ$'},
correct_answer:'D',
pembahasan:String.raw`<p>Kedua sudut berada di antara garis sejajar dan sepihak (sudut dalam sepihak), sehingga jumlahnya $180^\circ$.</p>
$$\begin{aligned}(2x+10)+(4x+20)&=180\\ 6x+30&=180\\ 6x&=150\\ x&=25\end{aligned}$$
$$4x+20=4(25)+20=120^\circ$$
<p><b>Analisis pengecoh:</b> $60^\circ$ = nilai $2x+10$ (sudut yang salah dipilih); $80^\circ$ = $4x-20$ (salah tanda); $100^\circ$ = $4x$ (lupa $+20$); $140^\circ$ = dari $6x=150$ salah dibagi 5 sehingga $x=30$.</p>`,
cara_cepat:String.raw`<p>Sudut dalam sepihak berjumlah $180^\circ$: $6x+30=180\Rightarrow x=25$. Cek: $60^\circ+120^\circ=180^\circ$.</p>`},

{id:2,type:'single',
question_text:String.raw`Diberikan kubus $ABCD.EFGH$ dengan panjang rusuk 12 cm. Jarak titik $A$ ke bidang $BDG$ adalah ....`,
image:CUBE('<polygon class="c" points="130,170 110,120 200,50" style="fill:rgba(0,214,216,.35)"/><path class="y" d="M40 150L200 50" stroke-dasharray="5"/>'),
options:{A:'$6\\sqrt2$ cm',B:'$4\\sqrt3$ cm',C:'$6\\sqrt3$ cm',D:'$8\\sqrt3$ cm',E:'$6$ cm'},
correct_answer:'B',
pembahasan:String.raw`<p>Letakkan koordinat: $A(0,0,0),\ B(12,0,0),\ D(0,12,0),\ G(12,12,12)$.</p>
$$\begin{aligned}\overrightarrow{BD}&=(-12,12,0),\quad\overrightarrow{BG}=(0,12,12)\\ \vec n&=\overrightarrow{BD}\times\overrightarrow{BG}=(144,144,-144)\parallel(1,1,-1)\end{aligned}$$
<p>Bidang $BDG$ melalui $B$: $x+y-z=12$. Jarak titik $A(0,0,0)$:</p>
$$d=\frac{|0+0-0-12|}{\sqrt{1^2+1^2+(-1)^2}}=\frac{12}{\sqrt3}=4\sqrt3\text{ cm}$$
<p><b>Analisis pengecoh:</b> $6\sqrt2$ = jarak $A$ ke garis $BD$ (setengah diagonal bidang); $6\sqrt3$ = setengah diagonal ruang $AG$; $8\sqrt3$ = ruas $GT$ ($\tfrac23AG$), bukan jarak $A$; $6$ = setengah rusuk.</p>`,
cara_cepat:String.raw`<p>$AG\perp$ bidang $BDG$ dan memotongnya di titik berat segitiga $BDG$, sehingga jarak $=\tfrac13AG=\tfrac13\times12\sqrt3=4\sqrt3$.</p>`},

{id:3,type:'single',
question_text:String.raw`Segitiga $ABC$ siku-siku di $B$ dengan $AB=12$ cm dan $BC=24$ cm. Di dalam segitiga dibuat persegi $PBQR$ dengan $P$ pada $AB$, $Q$ pada $BC$, dan $R$ pada $AC$. Luas daerah segitiga $ABC$ yang <b>tidak</b> tertutup persegi adalah ....`,
image:F('-50 0 280 135',300,'<polygon points="20,100 164,100 20,28"/><rect x="20" y="52" width="48" height="48" style="fill:rgba(0,214,216,.3)"/>'+T(6,26,'A')+T(6,112,'B')+T(168,106,'C')+T(6,56,'P')+T(64,114,'Q')+T(72,50,'R')+T(-44,66,'AB = 12')+T(80,128,'BC = 24 cm')),
options:{A:'$63\\text{ cm}^2$',B:'$72\\text{ cm}^2$',C:'$80\\text{ cm}^2$',D:'$96\\text{ cm}^2$',E:'$108\\text{ cm}^2$'},
correct_answer:'C',
pembahasan:String.raw`<p>Misalkan sisi persegi $s$. Segitiga $APR$ sebangun dengan segitiga $ABC$ (lihat gambar).</p>
$$\begin{aligned}\frac{AP}{AB}&=\frac{PR}{BC}\\ \frac{12-s}{12}&=\frac{s}{24}\\ 24(12-s)&=12s\\ 288&=36s\\ s&=8\end{aligned}$$
$$\begin{aligned}L_{ABC}&=\tfrac12\times12\times24=144\\ L_{\text{persegi}}&=8^2=64\\ L_{\text{sisa}}&=144-64=80\text{ cm}^2\end{aligned}$$
<p><b>Analisis pengecoh:</b> $63$ = memakai $s=9$ ($144-81$); $72$ = setengah luas segitiga; $96$ = mengira bagian tertutup persegi panjang $6\times8=48$; $108$ = memakai $s=6$ ($144-36$).</p>`,
cara_cepat:String.raw`<p>Persegi di sudut siku-siku: $s=\dfrac{12\times24}{12+24}=8$. Sisa $=144-64=80$.</p>`},

{id:4,type:'single',
question_text:String.raw`Taman berbentuk persegi panjang berukuran $40\text{ m}\times30\text{ m}$. Pada kedua diagonalnya dipasang lampu setiap 5 m, dimulai dari keempat pojok taman. Titik potong kedua diagonal juga dipasangi lampu, tetapi hanya satu lampu pada titik tersebut. Banyak lampu yang dipasang adalah ....`,
image:F('0 0 190 150',260,'<rect x="15" y="15" width="160" height="120"/><path d="M15 15L175 135M175 15L15 135" stroke-opacity=".4"/>'+dots([15,15],[175,135],10)+dots([175,15],[15,135],10)),
options:{A:'21',B:'11',C:'20',D:'22',E:'25'},
correct_answer:'A',
pembahasan:String.raw`$$d=\sqrt{40^2+30^2}=\sqrt{2500}=50\text{ m}$$
$$\text{Lampu per diagonal}=\frac{50}{5}+1=11$$
<p>Dua diagonal: $2\times11=22$. Titik potong berada 25 m dari pojok (kelipatan 5) sehingga terhitung dua kali.</p>
$$22-1=21\text{ lampu}$$
<p><b>Analisis pengecoh:</b> 11 = satu diagonal saja; 20 = $10+10$ (lupa $+1$ ujung); 22 = titik potong terhitung dua kali; 25 = $50\div2$.</p>`,
cara_cepat:String.raw`<p>Diagonal 50 m (tripel $3\!:\!4\!:\!5$). Rumus pagar-tiang: $\frac{50}{5}+1=11$. Dua diagonal $=22$, kurangi 1 titik potong bersama $=21$.</p>`},

{id:5,type:'single',
question_text:String.raw`Titik $P(a,b)$ ditranslasi oleh $T=(2,-3)$, kemudian didilatasi dengan pusat $O(0,0)$ dan faktor skala 2, lalu dirotasi $90^\circ$ berlawanan arah jarum jam dengan pusat $O(0,0)$. Bayangan akhir $P'$ ditunjukkan pada gambar. Nilai $a+b$ adalah ....`,
image:PL(-4,6,"P'"),
options:{A:'$-4$',B:'$2$',C:'$4$',D:'$6$',E:'$11$'},
correct_answer:'D',
pembahasan:String.raw`<p>Dari gambar, $P'=(-4,6)$. Kerjakan mundur. Rotasi $90^\circ$ berlawanan arah jarum jam: $(x,y)\to(-y,x)$.</p>
$$\begin{aligned}(-y,x)&=(-4,6)\Rightarrow(x,y)=(6,4)\\ \text{balik dilatasi}&:\ (6,4)\div2=(3,2)\\ \text{balik translasi}&:\ (3-2,\ 2+3)=(1,5)\end{aligned}$$
$$a+b=1+5=6$$
<p><b>Analisis pengecoh:</b> 11 = lupa membagi 2 ($(6,4)-(2,-3)=(4,7)$); 4 = tanda translasi terbalik ($(5,-1)$); $-4$ = rotasi dibalik ke arah yang salah ($(-5,1)$); 2 = lupa membalik rotasi ($(-4,6)$).</p>`,
cara_cepat:String.raw`<p>Cek maju: $(1,5)\to(3,2)\to(6,4)\to(-4,6)=P'\ \checkmark$. Maka $a+b=6$.</p>`},

{id:6,type:'single',
question_text:String.raw`Ruang aula berbentuk balok dengan panjang 12 m, lebar 4 m, dan tinggi 3 m. Dua kabel dipasang, masing-masing dari sebuah pojok lantai ke pojok langit-langit yang berseberangan (diagonal ruang). Jika tersedia gulungan kabel 40 m, sisa kabel setelah kedua kabel dipasang adalah ....`,
image:CUBE('<path class="y" d="M40 150L200 50M130 170L110 30"/>',T(60,176,'p = 12 m')+T(168,170,'l = 4 m')+T(4,110,'t = 3 m')),
options:{A:'2 m',B:'6 m',C:'14 m',D:'26 m',E:'27 m'},
correct_answer:'C',
pembahasan:String.raw`$$\begin{aligned}\text{Diagonal ruang}&=\sqrt{12^2+4^2+3^2}\\ &=\sqrt{144+16+9}=\sqrt{169}=13\text{ m}\\ \text{Dua kabel}&=2\times13=26\text{ m}\\ \text{Sisa}&=40-26=14\text{ m}\end{aligned}$$
<p><b>Analisis pengecoh:</b> 2 m = memakai jumlah ukuran $(12+4+3)\times2=38$; 6 m = $\sqrt{4^2+3^2}+12=17$ per kabel; 26 m = panjang yang terpakai, bukan sisa; 27 m = hanya satu kabel.</p>`,
cara_cepat:String.raw`<p>Tripel kembar: $12^2+4^2+3^2=13^2$, jadi tiap kabel 13 m. $40-2(13)=14$.</p>`},

{id:7,type:'single',
question_text:String.raw`Sebuah ornamen terdiri dari segitiga sama kaki dengan alas 24 cm dan tinggi 9 cm, serta lingkaran berdiameter 12 cm yang berpusat di titik tengah alas segitiga. Luas seluruh daerah ornamen (gabungan segitiga dan lingkaran) adalah .... (gunakan $\pi=3{,}14$)`,
image:F('0 0 200 135',280,'<polygon points="28,70 172,70 100,16"/><circle cx="100" cy="70" r="36"/><path class="c" d="M100 16V70" stroke-dasharray="4"/>'+T(104,30,'9')+T(84,126,'24 cm')+T(36,36,'15 cm')+T(80,88,'d = 12 cm')),
options:{A:'$136{,}26\\text{ cm}^2$',B:'$164{,}52\\text{ cm}^2$',C:'$221{,}04\\text{ cm}^2$',D:'$236{,}52\\text{ cm}^2$',E:'$334{,}08\\text{ cm}^2$'},
correct_answer:'B',
pembahasan:String.raw`<p>Sisi miring $=\sqrt{12^2+9^2}=15$ cm. Jarak pusat lingkaran ke sisi miring $=\dfrac{12\times9}{15}=7{,}2>6$, sehingga setengah lingkaran atas seluruhnya berada di dalam segitiga. Hanya setengah lingkaran bawah yang menambah luas.</p>
$$\begin{aligned}L_{\triangle}&=\tfrac12\times24\times9=108\\ L_{\frac12\text{ lingk.}}&=\tfrac12\times3{,}14\times6^2=56{,}52\\ L&=108+56{,}52=164{,}52\text{ cm}^2\end{aligned}$$
<p><b>Analisis pengecoh:</b> 136,26 = $r=3$ (salah mengambil setengah jari-jari); 221,04 = menambah lingkaran penuh; 236,52 = tinggi diganti sisi miring ($\tfrac12\times24\times15=180$); 334,08 = memakai $r=12$ (diameter dianggap jari-jari).</p>`,
cara_cepat:String.raw`<p>Lingkaran berpusat di alas dan $r<$ jarak ke sisi miring, jadi tambahkan hanya setengah lingkaran bawah: $108+18\pi=108+56{,}52$.</p>`},

{id:8,type:'single',
question_text:String.raw`Segitiga $ABC$ memiliki $AB=10$ cm dan $BC=8$ cm. Berapakah luas segitiga $ABC$? Putuskan apakah pernyataan (1) dan (2) berikut cukup untuk menjawab pertanyaan tersebut.<br>1) $\angle ABC=90^\circ$.<br>2) Keliling segitiga $ABC$ adalah 30 cm.`,
image:F('0 0 220 130',260,'<polygon points="20,110 190,110 140,20"/>'+T(8,122,'A')+T(194,122,'B')+T(142,14,'C')+T(90,126,'AB = 10')+T(176,62,'BC = 8')+T(10,14,'(tidak sesuai skala)')),
options:{A:'Pernyataan (1) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (2) SAJA tidak cukup.',B:'Pernyataan (2) SAJA cukup untuk menjawab pertanyaan, tetapi pernyataan (1) SAJA tidak cukup.',C:'DUA pernyataan BERSAMA-SAMA cukup untuk menjawab pertanyaan, tetapi SATU pernyataan SAJA tidak cukup.',D:'Pernyataan (1) SAJA cukup untuk menjawab pertanyaan dan pernyataan (2) SAJA cukup.',E:'Pernyataan (1) dan pernyataan (2) tidak cukup untuk menjawab pertanyaan.'},
correct_answer:'D',
pembahasan:String.raw`<p><b>Pernyataan (1) saja:</b> $AB\perp BC$, sehingga $L=\tfrac12\times10\times8=40\text{ cm}^2$. Cukup.</p>
<p><b>Pernyataan (2) saja:</b></p>
$$\begin{aligned}AC&=30-10-8=12\text{ cm}\\ s&=\tfrac12(30)=15\\ L&=\sqrt{15\,(15-10)(15-8)(15-12)}\\ &=\sqrt{15\times5\times7\times3}=\sqrt{1575}=15\sqrt7\text{ cm}^2\end{aligned}$$
<p>Sisi $10,8,12$ memenuhi ketaksamaan segitiga, jadi segitiga terbentuk dan luasnya tunggal. Cukup. Jawaban D.</p>
<p><b>Analisis pengecoh:</b> A = mengira (2) tidak cukup karena tidak ada sudut siku-siku; B = mengira hanya (2) yang memberi sisi ketiga; C = mengira keduanya harus digabung; E = mengira luas butuh tinggi yang tidak diketahui.</p>`,
cara_cepat:String.raw`<p>Tiga sisi segitiga menentukan luasnya (rumus Heron), dan dua sisi yang mengapit sudut siku-siku juga menentukannya. Masing-masing sudah cukup.</p>`},

{id:9,type:'single',
question_text:String.raw`Sebuah tabung tegak berjari-jari 10 cm dan tinggi 25 cm berisi air setinggi 15 cm. Ke dalam tabung dimasukkan 5 bola logam padat berjari-jari 3 cm hingga seluruhnya tenggelam. Kenaikan tinggi air dalam tabung adalah ....`,
image:F('0 0 220 175',230,'<ellipse cx="70" cy="20" rx="50" ry="12"/><path d="M20 20V150M120 20V150M20 150a50 12 0 0 0 100 0"/><ellipse class="c" cx="70" cy="75" rx="50" ry="12"/><circle cx="40" cy="135" r="13"/><circle cx="70" cy="138" r="13"/><circle cx="100" cy="135" r="13"/><circle cx="55" cy="110" r="13"/><circle cx="85" cy="110" r="13"/>'+T(130,55,'air 15 cm')+T(130,100,'t = 25 cm')+T(46,172,'r = 10 cm')),
options:{A:'$0{,}6$ cm',B:'$1{,}35$ cm',C:'$1{,}8$ cm',D:'$5{,}4$ cm',E:'$14{,}4$ cm'},
correct_answer:'C',
pembahasan:String.raw`$$\begin{aligned}V_{\text{bola}}&=\tfrac43\pi r^3=\tfrac43\pi(27)=36\pi\\ V_{5\text{ bola}}&=180\pi\\ \pi(10)^2\,\Delta h&=180\pi\\ \Delta h&=\tfrac{180}{100}=1{,}8\text{ cm}\end{aligned}$$
<p>Tinggi air akhir $16{,}8<25$ cm, jadi air tidak tumpah.</p>
<p><b>Analisis pengecoh:</b> 0,6 = $\tfrac43\pi r^2$ (pangkat salah); 1,35 = $\pi r^3$ (lupa $\tfrac43$); 5,4 = $4\pi r^3$ (lupa $\tfrac13$); 14,4 = diameter 6 dipakai sebagai jari-jari.</p>`,
cara_cepat:String.raw`<p>$\Delta h=\dfrac{5\times\frac43 r^3}{R^2}=\dfrac{5\times36}{100}=1{,}8$ (faktor $\pi$ saling meniadakan).</p>`},

{id:10,type:'single',
question_text:String.raw`Topi ulang tahun berbentuk kerucut tanpa alas dengan jari-jari alas 7 cm dan tinggi 24 cm dibuat dari karton. Akan dibuat 20 topi. Karton dijual per lembar seharga Rp6.000,00 dan setiap lembar mampu menutupi $1.200\text{ cm}^2$. Sisa potongan karton dapat dipakai lagi. Berapakah biaya minimal pembelian karton? (gunakan $\pi=\tfrac{22}{7}$)`,
image:F('0 0 190 160',200,'<path d="M70 10L20 130M70 10L120 130M20 130a50 10 0 0 0 100 0"/><ellipse cx="70" cy="130" rx="50" ry="10" stroke-opacity=".4"/><path class="c" d="M70 10V130M70 130H120" stroke-dasharray="4"/>'+T(74,75,'t = 24 cm')+T(84,126,'r = 7 cm')+T(18,62,'s = ?')),
options:{A:'Rp54.000,00',B:'Rp55.000,00',C:'Rp72.000,00',D:'Rp120.000,00',E:'Rp60.000,00'},
correct_answer:'E',
pembahasan:String.raw`$$\begin{aligned}s&=\sqrt{7^2+24^2}=\sqrt{625}=25\text{ cm}\\ L_{\text{selimut}}&=\pi rs=\tfrac{22}{7}\times7\times25=550\text{ cm}^2\\ 20\text{ topi}&=20\times550=11.000\text{ cm}^2\\ \text{Lembar}&=\tfrac{11.000}{1.200}\approx9{,}17\to10\\ \text{Biaya}&=10\times6.000=\text{Rp}60.000\end{aligned}$$
<p><b>Analisis pengecoh:</b> Rp54.000 = tinggi dipakai sebagai garis pelukis ($528\times20=10.560\to9$ lembar); Rp55.000 = $9{,}17$ lembar tidak dibulatkan; Rp72.000 = luas alas ikut dihitung (12 lembar); Rp120.000 = tiap topi membeli 1 lembar sendiri.</p>`,
cara_cepat:String.raw`<p>Tripel $7\!:\!24\!:\!25$ memberi $s=25$. $\pi rs=550$; $20\times550=11.000$; $11.000\div1.200\to10$ lembar $\to$ Rp60.000.</p>`}
];

['Kesebangunan dua trapesium dan Pythagoras','Memasangkan titik yang sesuai, kali silang','Persegi dalam segitiga siku-siku: kesebangunan lalu luas sisa'],
['Pythagoras dan banyak pot pada sisi miring (pembulatan ke bawah)','Tripel Pythagoras, pembagian dibulatkan','Lampu pada dua diagonal: aturan pagar-tiang $+1$ dan titik potong dihitung sekali'],
['Komposisi refleksi dan rotasi, mencari titik awal','Bekerja mundur dari bayangan','Tiga transformasi (translasi, dilatasi, rotasi) dibalik, jawab $a+b$'],
['Jarak di langit-langit (Pythagoras 2D) dan sisa tali','Pengecoh ukuran tinggi','Diagonal ruang 3D, dua kabel, sisa gulungan'],
['Keliling gabungan segitiga dan lingkaran','Hanya tepi luar yang dihitung','Luas gabungan; periksa bagian lingkaran yang berada di dalam segitiga'],
['Kecukupan data pada layang-layang','Menguji tiap pernyataan, lalu digabung','Kecukupan data luas segitiga: siku-siku vs tiga sisi (Heron), masing-masing cukup'],
['Pengepakan kardus dalam bak truk (volume dan lapisan)','Batas atas dari luas lantai','Volume bangun lengkung: bola dalam tabung berisi air, kenaikan tinggi air'],
['Luas selimut tabung dan pembulatan harga','Pembulatan ke atas, sisa dipakai lagi','Kerucut: garis pelukis dari Pythagoras, total luas, pembulatan lembar, harga']
];

/* ===== State ===== */
const $=s=>document.querySelector(s), Q=questions;
let cur=0, ans={}, secs=0, tm;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const done=i=>{const a=ans[i];return a!==undefined&&(typeof a==='string'||(Array.isArray(a)?a.length>0:Object.keys(a).length>=Object.keys(Q[i].options).length))};
const isOk=(q,a)=>{if(a===undefined)return false;
  if(q.type==='single')return a===q.correct_answer;
  if(q.type==='multi')return [...a].sort().join()===[...q.correct_answer].sort().join();
  return Object.keys(q.correct_answer).every(k=>a[k]===q.correct_answer[k]);};
const typeset=()=>{window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise([$('#app')]).catch(()=>{});};
const imgH=q=>!q.image?'':q.image.startsWith('<svg')?q.image.replace('<svg','<svg class="'+IMG+'"'):`<img src="${q.image}" alt="Gambar soal" class="${IMG}">`;
const hint={single:'Pilih satu jawaban.',multi:'Pilih satu atau lebih jawaban.',tf:'Pilih Benar atau Salah untuk tiap pernyataan.'};

/* ===== State 1: Mengerjakan ===== */
function navH(){return Q.map((_,i)=>`<button data-go="${i}" class="nb shrink-0 rounded-lg font-bold border ${done(i)?'bg-[#ffd300] text-black border-[#ffd300]':'bg-white/10 text-white border-white/30'} ${i===cur?'ring-2 ring-[#00d6d8] shadow-[0_0_10px_#00d6d8]':''}">${i+1}</button>`).join('');}
function optsH(q){
  if(q.type==='tf'){const a=ans[cur]||{};
    return Object.entries(q.options).map(([k,t])=>`<div class="border border-white/20 rounded-xl p-3"><div class="mb-2">${t}</div><div class="flex gap-2">${[['B','Benar'],['S','Salah']].map(([v,l])=>`<label class="opt !w-auto flex-1 justify-center"><input type="radio" name="t_${k}" value="${v}" data-k="${k}" ${a[k]===v?'checked':''}>${l}</label>`).join('')}</div></div>`).join('');}
  const m=q.type==='multi',a=ans[cur];
  return Object.entries(q.options).map(([k,t])=>`<label class="opt"><input type="${m?'checkbox':'radio'}" name="o" value="${k}" ${(m?(a||[]).includes(k):a===k)?'checked':''}><b class="text-[#00d6d8]">${k}.</b><span class="flex-1">${t}</span></label>`).join('');}
function renderQuiz(){const q=Q[cur],last=cur===Q.length-1;
  $('#app').innerHTML=`<div class="grid lg:grid-cols-4 gap-4">
  <section class="lg:col-span-3 bg-[#03317a]/60 border border-[#00d6d8]/30 rounded-2xl p-4 md:p-6">
    <div class="flex justify-between items-center text-sm mb-3"><span class="text-[#00d6d8] font-bold">Soal ${cur+1} dari ${Q.length}</span><span id="sw" class="font-mono bg-black/30 rounded-lg px-3 py-1"><i class="fa-regular fa-clock"></i> ${fmt(secs)}</span></div>
    <div class="text-base md:text-lg leading-relaxed">${q.question_text}</div>${imgH(q)}
    <p class="text-xs text-white/60 mb-2">${hint[q.type]}</p>
    <div id="opts" class="space-y-2">${optsH(q)}</div>
    <div class="flex justify-between gap-2 mt-6">
      <button data-d="-1" ${cur?'':'disabled'} class="px-4 py-2 rounded-lg border border-[#00d6d8] hover:bg-[#00d6d8]/20 disabled:opacity-30"><i class="fa-solid fa-chevron-left"></i> Sebelumnya</button>
      ${last?'<button data-fin class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold">Selesai &amp; Lihat Pembahasan</button>':'<button data-d="1" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold">Selanjutnya <i class="fa-solid fa-chevron-right"></i></button>'}
    </div>
    <p class="warn text-sm mt-3 text-yellow-300"></p>
  </section>
  <aside class="lg:col-span-1 bg-[#03317a]/60 border border-[#00d6d8]/30 rounded-2xl p-4 h-fit">
    <div class="text-sm font-bold mb-2">Navigasi Soal <span id="cnt" class="text-white/60 font-normal"></span></div>
    <div id="nav" class="flex gap-2 overflow-x-auto pb-2 lg:grid lg:grid-cols-5 lg:overflow-visible">${navH()}</div>
    <button data-fin class="w-full mt-3 px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold">Selesai &amp; Lihat Pembahasan</button>
    <p class="warn text-sm mt-2 text-yellow-300"></p>
  </aside></div>`;
  upd();typeset();}
function upd(){const left=Q.filter((_,i)=>!done(i)).length;document.querySelectorAll('[data-fin]').forEach(b=>{b.disabled=left>0;b.classList.toggle('opacity-40',left>0);b.classList.toggle('cursor-not-allowed',left>0)});document.querySelectorAll('.warn').forEach(w=>w.innerHTML=left?`<i class="fa-solid fa-circle-info"></i> Tombol &ldquo;Selesai &amp; Lihat Pembahasan&rdquo; baru aktif setelah semua soal dijawab. Masih ${left} soal belum selesai.`:'<span class="text-green-300"><i class="fa-solid fa-circle-check"></i> Semua soal sudah dijawab. Silakan klik Selesai.</span>');$('#nav').innerHTML=navH();$('#cnt').textContent=`(${Q.filter((_,i)=>done(i)).length}/${Q.length} terjawab)`;}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'),d=e.target.closest('[data-d]'),f=e.target.closest('[data-fin]');
  if(g){cur=+g.dataset.go;renderQuiz();window.scrollTo(0,0)}
  else if(d){cur+=+d.dataset.d;renderQuiz();window.scrollTo(0,0)}
  else if(f)finish();});
document.addEventListener('change',e=>{
  const i=e.target,q=Q[cur];if(!i.closest('#opts'))return;
  if(q.type==='single')ans[cur]=i.value;
  else if(q.type==='multi')ans[cur]=[...document.querySelectorAll('#opts input:checked')].map(x=>x.value);
  else{ans[cur]=ans[cur]||{};ans[cur][i.dataset.k]=i.value}
  upd();});
tm=setInterval(()=>{secs++;const s=$('#sw');if(s)s.innerHTML=`<i class="fa-regular fa-clock"></i> ${fmt(secs)}`},1000);

/* ===== State 2: Pembahasan ===== */
function finish(){if(Q.some((_,i)=>!done(i)))return;
  clearInterval(tm);renderResult();window.scrollTo(0,0);}
const tfL={B:'Benar',S:'Salah'};
function reviewH(q,i){const a=ans[i];
  if(q.type==='tf')return Object.entries(q.options).map(([k,t])=>{const u=a&&a[k],ok=u===q.correct_answer[k];
    return `<div class="border rounded-xl p-3 ${ok?'border-green-400 bg-green-500/15':'border-red-400 bg-red-500/15'}"><div>${t}</div><div class="text-sm mt-1">Jawaban Anda: <b>${u?tfL[u]:'Kosong'}</b> ${ok?'<i class="fa-solid fa-circle-check text-green-400"></i>':'<i class="fa-solid fa-circle-xmark text-red-400"></i>'} · Kunci: <b>${tfL[q.correct_answer[k]]}</b></div></div>`}).join('');
  const key=[].concat(q.correct_answer),mine=[].concat(a||[]);
  return Object.entries(q.options).map(([k,t])=>{const isK=key.includes(k),isM=mine.includes(k);
    const c=isK?'border-green-400 bg-green-500/15':isM?'border-red-400 bg-red-500/15':'border-white/20';
    return `<div class="flex gap-3 items-center border rounded-xl px-4 py-3 ${c}"><b class="text-[#00d6d8]">${k}.</b><span class="flex-1">${t}</span>${isK?'<span class="text-green-300 text-xs whitespace-nowrap"><i class="fa-solid fa-key"></i> Kunci</span>':''}${isM?`<span class="${isK?'text-green-300':'text-red-300'} text-xs whitespace-nowrap">Jawaban Anda</span>`:''}</div>`}).join('');}
function renderResult(){
  const ok=Q.filter((q,i)=>isOk(q,ans[i])).length,sc=Math.round(ok/Q.length*100),wr=Q.length-ok;
  const st=(l,v,c)=>`<div class="bg-black/25 rounded-xl p-3 text-center"><div class="text-xs text-white/70">${l}</div><div class="text-2xl font-bold ${c}">${v}</div></div>`;
  $('#app').innerHTML=`<div class="max-w-4xl mx-auto">
  <div class="bg-gradient-to-r from-[#03317a] to-[#044a8f] border border-[#00d6d8] rounded-2xl p-5 mb-6 shadow-[0_0_25px_rgba(0,214,216,.3)]">
    <h2 class="text-xl font-bold mb-3"><i class="fa-solid fa-flag-checkered text-[#ffd300]"></i> Ringkasan Hasil Latihan</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${st('Skor Akhir',sc,'text-[#ffd300]')}${st('Total Benar',ok,'text-green-400')}${st('Total Salah',wr,'text-red-400')}${st('Waktu Pengerjaan',fmt(secs),'text-[#00d6d8]')}</div>
    <div class="flex flex-wrap gap-2 mt-4"><button onclick="location.reload()" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold"><i class="fa-solid fa-rotate-right"></i> Ulangi Latihan</button><a href="geometri.html" class="px-4 py-2 rounded-lg border border-[#00d6d8]">Kembali ke Dashboard</a></div>
  </div>`+Q.map((q,i)=>{const o=isOk(q,ans[i]),un=!done(i);
  const key=q.type==='tf'?Object.entries(q.correct_answer).map(([k,v])=>k+': '+tfL[v]).join(', '):[].concat(q.correct_answer).join(', ');
  return `<article class="bg-[#03317a]/60 border border-white/20 rounded-2xl p-4 md:p-6 mb-6">
    <div class="flex justify-between items-center mb-2"><span class="font-bold text-[#00d6d8]">Soal ${i+1}</span>
    <span class="text-sm font-bold ${o?'text-green-400':un?'text-yellow-300':'text-red-400'}">${o?'<i class="fa-solid fa-circle-check"></i> Benar':un?'<i class="fa-solid fa-triangle-exclamation"></i> Tidak dijawab':'<i class="fa-solid fa-circle-xmark"></i> Salah'}</span></div>
    <div class="leading-relaxed">${q.question_text}</div>${imgH(q)}
    <div class="space-y-2">${reviewH(q,i)}</div>
    <p class="mt-3 text-sm">Jawaban kunci: <b class="text-[#ffd300]">${key}</b></p>
    <div class="bg-[#022050] border border-white/20 rounded-xl p-4 mt-4 overflow-x-auto"><h4 class="font-bold mb-2"><i class="fa-solid fa-book-open text-[#00d6d8]"></i> Pembahasan Lengkap</h4>${(PI[q.id]||[]).map(f=>f.replace('<svg','<svg class="'+IMG+'"')).join('')}${q.pembahasan}</div>
    <div class="bg-[#00d6d8]/15 border border-[#00d6d8]/60 rounded-xl p-4 mt-4 overflow-x-auto"><h4 class="font-bold mb-2">🔥 Cara Cepat / Trik</h4>${q.cara_cepat}</div>
  </article>`}).join('')+'</div>';
  typeset();}

renderQuiz();
window.addEventListener('load',typeset);
</script>
</body>
</html>
