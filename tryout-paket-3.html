function optionHtml(q, i) {
  const t = typeOf(q), a = state.answers[i];
  if (t === 'single') {
    return q.options.map((o, k) => {
      const sel = a === k;
      return `<button onclick="pickSingle(${k})" class="opt ${sel ? 'sel' : ''} w-full text-left flex items-start gap-3 p-3 sm:p-4 rounded-xl border">
        <span class="radio ${sel ? 'on' : ''} mt-0.5"></span>
        <span class="font-bold w-6 shrink-0">${letters[k]}.</span>
        <span class="min-w-0 break-words">${o}</span></button>`;
    }).join('');
  }
  if (t === 'multi') {
    return `<div class="text-sm text-[#00d6d8] mb-1"><i class="fa-solid fa-circle-info mr-1"></i>Pilih semua jawaban yang benar (lebih dari satu).</div>` +
      q.options.map((o, k) => {
        const sel = a.includes(k);
        return `<button onclick="toggleMulti(${k})" class="opt ${sel ? 'sel' : ''} w-full text-left flex items-start gap-3 p-3 sm:p-4 rounded-xl border">
          <span class="chk ${sel ? 'on' : ''} mt-0.5"></span>
          <span class="font-bold w-6 shrink-0">${letters[k]}.</span>
          <span class="min-w-0 break-words">${o}</span></button>`;
      }).join('');
  }
  return `<div class="text-sm text-[#00d6d8] mb-1"><i class="fa-solid fa-circle-info mr-1"></i>Tentukan Benar atau Salah untuk setiap pernyataan.</div>` +
    q.options.map((o, k) => `
    <div class="opt w-full p-3 sm:p-4 rounded-xl border">
      <div class="flex gap-3 mb-3"><span class="font-bold w-6 shrink-0">${letters[k]}.</span><span class="min-w-0 break-words">${o}</span></div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="setTF(${k},true)" class="tfbtn ${a[k] === true ? 'on' : ''} py-2 rounded-lg"><i class="fa-solid fa-check mr-1"></i>Benar</button>
        <button onclick="setTF(${k},false)" class="tfbtn ${a[k] === false ? 'on' : ''} py-2 rounded-lg"><i class="fa-solid fa-xmark mr-1"></i>Salah</button>
      </div>
    </div>`).join('');
}

function go(n) {
  if (n < 0 || n >= questions.length) return;
  state.cur = n;
  renderExam();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function pickSingle(k) { state.answers[state.cur] = k; renderExam(); }
function toggleMulti(k) {
  const a = state.answers[state.cur], p = a.indexOf(k);
  if (p >= 0) a.splice(p, 1); else a.push(k);
  renderExam();
}
function setTF(k, v) {
  const a = state.answers[state.cur];
  a[k] = a[k] === v ? null : v;
  renderExam();
}

function startTimer() {
  state.timer = setInterval(() => {
    state.remaining--;
    const t = $('timer');
    if (t) {
      t.textContent = fmtTime(Math.max(0, state.remaining));
      if (state.remaining <= 300) t.parentElement.classList.add('text-red-400', 'border-red-400');
    }
    if (state.remaining <= 0) finish(true);
  }, 1000);
}

function endExam() {
  const kosong = questions.length - answeredCount();
  const msg = kosong > 0
    ? `Masih ada ${kosong} soal yang belum dijawab. Yakin ingin mengakhiri ujian dan melihat pembahasan?`
    : 'Semua soal sudah dijawab. Akhiri ujian dan lihat pembahasan?';
  showConfirm(msg);
}

function closeConfirm() {
  const m = document.getElementById('confirmModal');

function finish(auto) {
  clearInterval(state.timer);
  window.removeEventListener('beforeunload', guard);
  state.mode = 'review';

  renderNav();
  renderReview();
  window.scrollTo({ top: 0 });
}

function reviewOptions(q, i) {
  const t = typeOf(q), a = state.answers[i];
  if (t === 'single') {
    return q.options.map((o, k) => {
      const isKey = k === q.correct, isUser = a === k;
      const cls = isKey ? 'ok' : (isUser ? 'bad' : '');
      const tag = isKey && isUser ? '<span class="text-green-300 text-xs font-bold ml-auto shrink-0">✔ Jawaban Anda = Kunci</span>'
        : isKey ? '<span class="text-green-300 text-xs font-bold ml-auto shrink-0">✔ Kunci</span>'
        : isUser ? '<span class="text-red-300 text-xs font-bold ml-auto shrink-0">✘ Jawaban Anda</span>' : '';
      return `<div class="opt ${cls} flex items-start gap-3 p-3 rounded-xl border"><span class="font-bold w-6 shrink-0">${letters[k]}.</span><span class="min-w-0 break-words">${o}</span>${tag}</div>`;
    }).join('');
  }
  if (t === 'multi') {
    return q.options.map((o, k) => {
      const isKey = q.correct.includes(k), isUser = a.includes(k);
      const cls = isKey ? 'ok' : (isUser ? 'bad' : '');
      const tag = isKey && isUser ? '✔ Benar & Anda pilih' : isKey ? '✔ Kunci (tidak Anda pilih)' : isUser ? '✘ Anda pilih (salah)' : '';
      const col = isKey ? 'text-green-300' : 'text-red-300';
      return `<div class="opt ${cls} flex items-start gap-3 p-3 rounded-xl border"><span class="font-bold w-6 shrink-0">${letters[k]}.</span><span class="min-w-0 break-words">${o}</span>${tag ? `<span class="${col} text-xs font-bold ml-auto shrink-0">${tag}</span>` : ''}</div>`;
    }).join('');
  }
  return q.options.map((o, k) => {
    const u = a[k], c = q.correct[k], ok = u === c;
    const cls = u === null ? '' : (ok ? 'ok' : 'bad');
    return `<div class="opt ${cls} p-3 rounded-xl border">
      <div class="flex gap-3"><span class="font-bold w-6 shrink-0">${letters[k]}.</span><span class="min-w-0 break-words">${o}</span></div>
      <div class="mt-2 text-xs flex flex-wrap gap-x-4 gap-y-1">
        <span>Jawaban Anda: <b>${u === null ? '—' : u ? 'Benar' : 'Salah'}</b></span>
        <span class="text-green-300">Kunci: <b>${c ? 'Benar' : 'Salah'}</b></span>
      </div></div>`;
  }).join('');
}

    const answered = isAnswered(i), ok = answered && isCorrect(i);
    const badge = !answered ? '<span class="px-3 py-1 rounded-full bg-white/15 text-xs font-bold">Kosong</span>'
      : ok ? '<span class="px-3 py-1 rounded-full bg-green-500/80 text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>Benar</span>'
      : '<span class="px-3 py-1 rounded-full bg-red-500/80 text-xs font-bold"><i class="fa-solid fa-xmark mr-1"></i>Salah</span>';
    return `
    <article class="rounded-2xl border border-white/15 bg-white/5 p-4 sm:p-6">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="px-3 py-1 rounded-full bg-[#00d6d8] text-[#022050] font-extrabold text-sm">Soal ${i + 1}</span>
        <span class="px-3 py-1 rounded-full bg-white/10 text-xs">${q.topic}</span>${badge}
      </div>
      ${questionBlock(q)}
      <div class="mt-4 flex flex-col gap-2">${reviewOptions(q, i)}</div>
      <div class="mt-4 grid sm:grid-cols-2 gap-2 text-sm">
        <div class="rounded-lg bg-white/10 p-3"><span class="text-gray-300">Jawaban Anda:</span> <b class="${!answered ? '' : ok ? 'text-green-300' : 'text-red-300'}">${fmtAns(q, state.answers[i])}</b></div>
        <div class="rounded-lg bg-green-500/15 border border-green-500/40 p-3"><span class="text-gray-300">Kunci Jawaban:</span> <b class="text-green-300">${fmtKey(q)}</b></div>
      </div>
      <div class="mt-4 rounded-xl border border-gray-500 bg-[#011a42] p-4">
        <h4 class="font-bold text-[#ffd300] mb-2"><i class="fa-solid fa-book-open mr-2"></i>Pembahasan Lengkap</h4>
        <div class="pemb text-sm sm:text-base">${stepsHtml(q.pembahasan)}</div>
        ${q.pembahasan_image ? `<img src="${q.pembahasan_image}" alt="Ilustrasi pembahasan soal ${q.id}" loading="lazy" class="max-w-full h-auto object-contain block mx-auto rounded-lg border border-gray-600 bg-white/10 p-2 my-3" style="width:min(100%,600px)">` : ''}
      </div>
      <div class="mt-3 rounded-xl border border-[#00d6d8]/50 bg-[#00d6d8]/10 p-4">
        <h4 class="font-bold text-[#00d6d8] mb-2">🔥 Cara Cepat</h4>
        <div class="text-sm sm:text-base leading-relaxed break-words">${q.cara_cepat}</div>
      </div>
    </article>`;
  }).join('');

  $('app').innerHTML = `
  <div class="max-w-4xl mx-auto px-3 sm:px-4 py-5 flex flex-col gap-5">
    ${banner}
    <h2 class="text-xl font-bold text-[#00d6d8] mt-2"><i class="fa-solid fa-list-check mr-2"></i>Pembahasan Seluruh Soal</h2>
    ${cards}
    <a href="tryout.html" class="block w-full text-center py-4 rounded-xl bg-[#ffd300] text-black font-extrabold text-lg hover:brightness-110"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali ke Dashboard</a>
  </div>`;
  typeset($('app'));
}

   INIT
   ========================================================= */
function guard(e) { e.preventDefault(); e.returnValue = ''; }
window.addEventListener('beforeunload', guard);
renderNav();
renderExam();
startTimer();
</script>
