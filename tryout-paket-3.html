/* =========================================================
   GAMBAR SOAL – dibuat dengan kode (SVG inline), tanpa file PNG
   ========================================================= */
const svgImg = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const sv = (w, h, inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde2e2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c0392b" stroke-width="2"/></pattern></defs><rect width="${w}" height="${h}" rx="10" fill="#ffffff"/>${inner}</svg>`;
const tx = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.s || 13}" fill="${o.c || '#1b1b1b'}" text-anchor="${o.a || 'middle'}" font-weight="${o.b ? 700 : 400}"${o.i ? ' font-style="italic"' : ''}>${t}</text>`;
const ln = (x1, y1, x2, y2, c = '#333', w = 1.5, d = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
const dm = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#c0392b" stroke-width="1.3" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
const ar1 = (x1, y1, x2, y2, c = '#c0392b') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.5" marker-end="url(#ar)"/>`;
const rc = (x, y, w, h, f = '#fff', s = '#333', r = 0, sw = 1.5) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const pg = (pts, f = 'none', s = '#333', sw = 1.5, d = '') => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
const ci = (x, y, r, f = '#fff', s = 'none', sw = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const pt = (p, c = '#111') => ci(p[0], p[1], 3.5, c);
const EG = (a, b, c = '#a8174f', w = 2.5, d = '') => ln(a[0], a[1], b[0], b[1], c, w, d);

function barChart({ w, h, title, items, max, step, ylabel, xlabel, showVal, ts = 15 }) {
  const L0 = 62, R0 = w - 20, T0 = 50, B0 = h - 56, k = (B0 - T0) / max, n = items.length, sl = (R0 - L0) / n, bw = Math.min(46, sl * 0.62);
  let o = tx(w / 2, 26, title, { s: ts, b: 1 });
  for (let v = 0; v <= max; v += step) { const y = B0 - v * k; o += ln(L0, y, R0, y, '#ddd', 1) + tx(L0 - 8, y + 4, v, { a: 'end', s: 11, c: '#555' }); }
  o += ln(L0, T0, L0, B0, '#555', 1.5) + ln(L0, B0, R0, B0, '#555', 1.5);
  items.forEach((it, i) => {
    const cx = L0 + sl * (i + 0.5);
    if (it.v != null) { const bh = it.v * k; o += rc(cx - bw / 2, B0 - bh, bw, bh, it.c || '#3b6fd4', 'none'); if (showVal) o += tx(cx, B0 - bh - 5, it.v, { s: 11, b: 1 }); }
    o += tx(cx, B0 + 16, it.l, { s: 12 });
  });
  o += tx(w / 2, h - 12, xlabel, { s: 12, c: '#555' });
  o += `<text transform="translate(16 ${(T0 + B0) / 2}) rotate(-90)" font-size="12" fill="#555" text-anchor="middle">${ylabel}</text>`;
  return sv(w, h, o);
}

   ========================================================= */
const FIG_N = '#022050', FIG_C = '#0e9aa7', FIG_Y = '#ffd300', FIG_R = '#d62839', FIG_G = '#2e9e5b', FIG_GR = '#64748b';
const figEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const figUri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const figDoc = (w, h, body) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" font-family="Arial, Helvetica, sans-serif" font-size="13">` +
  `<defs>` +
  `<marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${FIG_N}"/></marker>` +
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${FIG_R}"/></marker>` +
  `<pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde2e4"/><line x1="0" y1="0" x2="0" y2="6" stroke="${FIG_R}" stroke-width="2"/></pattern>` +
  `</defs><rect width="${w}" height="${h}" rx="10" fill="#f8fafc"/>${body}</svg>`;
const fT = (x, y, t, o = {}) =>
  `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.s || 13}" fill="${o.c || FIG_N}" font-weight="${o.b ? 700 : 400}"${o.i ? ' font-style="italic"' : ''}${o.h ? ' stroke="#f8fafc" stroke-width="4" paint-order="stroke"' : ''}${o.r ? ` transform="rotate(${o.r} ${x} ${y})"` : ''}>${figEsc(t)}</text>`;
const fL = (x1, y1, x2, y2, c = FIG_N, w = 2, d = '', m = '') =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"${d ? ` stroke-dasharray="${d}"` : ''}${m ? ` marker-end="url(#${m})"` : ''} stroke-linecap="round"/>`;
const fR = (x, y, w, h, f = 'none', s = FIG_N, sw = 1.5, r = 0) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const fC = (x, y, r, f = 'none', s = FIG_N, sw = 1.5) =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${sw}"/>`;
const fP = (pts, f = 'none', s = FIG_N, sw = 1.5, d = '') =>
  `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
const fPath = (d, f = 'none', s = FIG_N, sw = 2, da = '') =>
  `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round"${da ? ` stroke-dasharray="${da}"` : ''}/>`;
const fDot = (x, y, c = FIG_R, r = 4) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
/* garis ukuran dua arah */
const fDim = (x1, y1, x2, y2, label, o = {}) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${FIG_N}" stroke-width="1.3" marker-start="url(#an)" marker-end="url(#an)"/>` +
  fT((x1 + x2) / 2 + (o.dx || 0), (y1 + y2) / 2 + (o.dy || -5), label, { s: o.s || 12, r: o.r, b: o.b, h: 1 });
const fRight = (x, y, dx, dy, s = 9) => `<path d="M${x + dx * s},${y} L${x + dx * s},${y + dy * s} L${x},${y + dy * s}" fill="none" stroke="${FIG_N}" stroke-width="1.2"/>`;

/* ---------- sumbu koordinat ---------- */
const fAxes = (w, h, ox, oy, sx, sy, xmax, ymax, o = {}) => {
  const X = x => ox + x * sx, Y = y => oy - y * sy;
  let s = '';
  if (o.grid) {
    for (let i = 0; i <= xmax; i += o.gx || 1) s += fL(X(i), Y(0), X(i), Y(ymax), '#e2e8f0', 1);
    for (let j = 0; j <= ymax; j += o.gy || 1) s += fL(X(0), Y(j), X(xmax), Y(j), '#e2e8f0', 1);
  }
  s += fL(X(o.xmin || 0), oy, X(xmax) + 14, oy, FIG_N, 2, '', 'an') + fL(ox, oy, ox, Y(ymax) - 14, FIG_N, 2, '', 'an');
  s += fT(X(xmax) + 20, oy + 4, o.xl || 'X', { b: 1, a: 'start' }) + fT(ox, Y(ymax) - 20, o.yl || 'Y', { b: 1 });
  (o.xt || []).forEach(v => { s += fL(X(v), oy - 4, X(v), oy + 4, FIG_N, 1.5) + fT(X(v), oy + 18, v); });
  (o.yt || []).forEach(v => { s += fL(ox - 4, Y(v), ox + 4, Y(v), FIG_N, 1.5) + fT(ox - 10, Y(v) + 4, v, { a: 'end' }); });
  return { X, Y, s };
};
