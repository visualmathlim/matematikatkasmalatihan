/* ============ STATE ============ */
const $ = id => document.getElementById(id);
let cur = 0, answers = {}, seconds = 0, timer = null, finished = false;
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const IMG_CLASS = 'max-w-full h-auto object-contain rounded-lg border border-gray-600 bg-white/10 p-2 my-4 block';

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([$('app')]).catch(() => {});
  else setTimeout(typeset, 300);
}
function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => { seconds++; const el = $('sw'); if (el) el.textContent = fmt(seconds); }, 1000);
}

/* ============ STATE 1: MENGERJAKAN ============ */
function renderQuiz() {
  const q = questions[cur], N = questions.length, last = cur === N - 1;
  const done = Object.keys(answers).length;
  const navBtns = questions.map((x, i) => {
    const on = answers[x.id] !== undefined;
    return `<button onclick="go(${i})" class="shrink-0 w-11 h-11 rounded-lg font-bold border transition ${on ? 'bg-[#ffd300] text-black border-[#ffd300]' : 'bg-white/5 text-white border-white/30 hover:border-[#00d6d8]'} ${i === cur ? 'glow' : ''}">${i + 1}</button>`;
  }).join('');
  const opts = Object.entries(q.options).map(([k, v]) => {
    const sel = answers[q.id] === k;
    return `<label class="opt flex items-center gap-3 w-full p-3 sm:p-4 rounded-xl border cursor-pointer transition ${sel ? 'bg-[#00d6d8]/25 border-[#00d6d8]' : 'bg-white/5 border-white/20'}">
      <input type="radio" name="opt" class="hidden" ${sel ? 'checked' : ''} onchange="pick('${k}')">
      <span class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center font-bold ${sel ? 'bg-[#00d6d8] text-black' : 'bg-white/10'}">${k}</span>
      <span class="min-w-0 overflow-x-auto">${v}</span></label>`;
  }).join('');

  $('app').innerHTML = `
  <div class="grid lg:grid-cols-[3fr_1fr] gap-4 items-start">
    <section class="bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-6 min-w-0">
      <div class="flex items-center justify-between mb-4">
        <span class="font-bold text-[#00d6d8]">Soal ${cur + 1} dari ${N}</span>
        <span class="bg-black/30 border border-[#00d6d8]/50 rounded-lg px-3 py-1 font-mono text-lg"><i class="fa-regular fa-clock mr-2 text-[#00d6d8]"></i><span id="sw">${fmt(seconds)}</span></span>
      </div>
      <div class="text-base sm:text-lg leading-relaxed overflow-x-auto">${q.question_text}</div>
      ${q.image ? `<img src="${q.image}" alt="Gambar soal ${cur + 1}" class="${IMG_CLASS}">` : ''}
      <div class="space-y-3 mt-4">${opts}</div>
      <div id="warn" class="hidden mt-4 p-3 rounded-lg bg-[#ffd300]/15 border border-[#ffd300] text-[#ffd300] text-sm"></div>
      <div class="flex justify-between gap-3 mt-6">
        <button onclick="go(cur-1)" ${cur === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-lg border border-[#00d6d8] text-[#00d6d8] font-semibold hover:bg-[#00d6d8] hover:text-black transition disabled:opacity-30 disabled:pointer-events-none"><i class="fa-solid fa-chevron-left mr-2"></i>Sebelumnya</button>
        ${last
          ? `<button onclick="finish()" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selesai &amp; Lihat Pembahasan<i class="fa-solid fa-flag-checkered ml-2"></i></button>`
          : `<button onclick="go(cur+1)" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selanjutnya<i class="fa-solid fa-chevron-right ml-2"></i></button>`}
      </div>
    </section>

    <aside class="bg-white/5 border border-white/10 rounded-2xl p-4 lg:sticky lg:top-20 min-w-0">
      <h2 class="font-bold mb-3 text-[#00d6d8]">Navigasi Soal</h2>
      <div class="scroll-x flex lg:flex-wrap gap-2 overflow-x-auto pb-2">${navBtns}</div>
      <p class="text-sm text-white/70 mt-2">Terjawab: <b class="text-[#ffd300]">${done}</b> / ${N}</p>
      <div class="mt-3 text-xs text-white/80 bg-[#00d6d8]/10 border border-[#00d6d8]/40 rounded-lg p-3">
        <i class="fa-solid fa-circle-info text-[#00d6d8] mr-1"></i>
        Semua soal harus dikerjakan. Jika masih ada yang kosong, latihan tidak bisa diselesaikan dan pembahasan belum dapat dibuka.
      </div>
      <button onclick="finish()" class="mt-3 w-full px-3 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110">Selesai &amp; Lihat Pembahasan</button>
    </aside>
  </div>`;
  typeset();
}
function go(i) { if (i < 0 || i >= questions.length) return; cur = i; renderQuiz(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function pick(k) { answers[questions[cur].id] = k; renderQuiz(); }
function finish() {
  const empty = questions.map((q, i) => answers[q.id] === undefined ? i + 1 : null).filter(Boolean);
  if (empty.length) {
    const w = $('warn');
    w.classList.remove('hidden');
    w.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Belum bisa selesai. Soal nomor <b>${empty.join(', ')}</b> belum dijawab. Kerjakan semua soal dulu, lalu klik "Selesai &amp; Lihat Pembahasan".`;
    w.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  clearInterval(timer); finished = true; renderReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ STATE 2: PEMBAHASAN & EVALUASI ============ */
function renderReview() {
  const N = questions.length;
  const benar = questions.filter(q => answers[q.id] === q.correct_answer).length;
  const salah = N - benar, skor = Math.round(benar / N * 100);
  const stat = (label, val, cls) => `<div class="bg-black/25 rounded-xl p-3 text-center"><div class="text-2xl sm:text-3xl font-extrabold ${cls}">${val}</div><div class="text-xs sm:text-sm text-white/70">${label}</div></div>`;

  const cards = questions.map((q, i) => {
    const mine = answers[q.id], ok = mine === q.correct_answer;
    const opts = Object.entries(q.options).map(([k, v]) => {
      let c = 'border-white/15 bg-white/5', tag = '';
      if (k === q.correct_answer) { c = 'border-green-400 bg-green-500/20'; tag = '<span class="ml-auto shrink-0 text-green-300 text-xs font-bold"><i class="fa-solid fa-check"></i> Kunci</span>'; }
      else if (k === mine) { c = 'border-red-400 bg-red-500/20'; tag = '<span class="ml-auto shrink-0 text-red-300 text-xs font-bold"><i class="fa-solid fa-xmark"></i> Jawabanmu</span>'; }
      if (k === mine && ok) tag = '<span class="ml-auto shrink-0 text-green-300 text-xs font-bold"><i class="fa-solid fa-check"></i> Jawabanmu (Benar)</span>';
      return `<div class="flex items-center gap-3 p-3 rounded-xl border ${c}"><span class="shrink-0 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold">${k}</span><span class="min-w-0 overflow-x-auto">${v}</span>${tag}</div>`;
    }).join('');
    return `
    <article class="bg-white/5 border border-white/10 rounded-2xl p-4 sm:p-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-[#00d6d8]">Soal ${i + 1}</h3>
        <span class="px-3 py-1 rounded-full text-sm font-bold ${ok ? 'bg-green-500/25 text-green-300' : 'bg-red-500/25 text-red-300'}">${ok ? '<i class="fa-solid fa-circle-check"></i> Benar' : '<i class="fa-solid fa-circle-xmark"></i> Salah'}</span>
      </div>
      <div class="text-base sm:text-lg leading-relaxed overflow-x-auto">${q.question_text}</div>
      ${q.image ? `<img src="${q.image}" alt="Gambar soal ${i + 1}" class="${IMG_CLASS}">` : ''}
      <div class="space-y-2 mt-3">${opts}</div>
      <p class="mt-3 text-sm">Jawabanmu: <b class="${ok ? 'text-green-300' : 'text-red-300'}">${mine}</b> &nbsp;|&nbsp; Kunci: <b class="text-green-300">${q.correct_answer}</b></p>

      <div class="mt-5 rounded-xl border border-white/20 bg-[#011836] p-4 prose-vm">
        <h4 class="font-bold text-[#ffd300] mb-2"><i class="fa-solid fa-book-open mr-2"></i>Pembahasan Lengkap</h4>
        ${q.pembahasan_image ? `<img src="${q.pembahasan_image}" alt="Ilustrasi pembahasan ${i + 1}" class="${IMG_CLASS}">` : ''}
        ${q.pembahasan}
      </div>
      <div class="mt-4 rounded-xl border border-[#00d6d8]/60 bg-[#00d6d8]/10 p-4 prose-vm">
        <h4 class="font-bold text-[#00d6d8] mb-2">🔥 Cara Cepat / Trik</h4>
        ${q.cara_cepat}
      </div>
    </article>`;
  }).join('');

  $('app').innerHTML = `
  <section class="rounded-2xl p-5 sm:p-6 mb-5 bg-gradient-to-br from-[#00d6d8]/25 to-[#022050] border border-[#00d6d8]/60">
    <h2 class="text-xl sm:text-2xl font-extrabold mb-4"><i class="fa-solid fa-trophy text-[#ffd300] mr-2"></i>Ringkasan Hasil Latihan</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${stat('Skor Akhir', skor, 'text-[#ffd300]')}${stat('Total Benar', benar, 'text-green-300')}
      ${stat('Total Salah', salah, 'text-red-300')}${stat('Waktu Pengerjaan', fmt(seconds), 'text-[#00d6d8]')}
    </div>
    <div class="flex flex-wrap gap-3 mt-4">
      <button onclick="restart()" class="px-4 py-2 rounded-lg bg-[#ffd300] text-black font-bold hover:brightness-110"><i class="fa-solid fa-rotate-right mr-2"></i>Ulangi Latihan</button>
      <a href="trigonometri.html" class="px-4 py-2 rounded-lg border border-[#00d6d8] text-[#00d6d8] font-semibold hover:bg-[#00d6d8] hover:text-black transition">Kembali ke Dashboard Trigonometri</a>
    </div>
  </section>
  <div class="space-y-5">${cards}</div>`;
  typeset();
}
function restart() { cur = 0; answers = {}; seconds = 0; finished = false; startTimer(); renderQuiz(); window.scrollTo({ top: 0 }); }

/* ============ INIT ============ */
renderQuiz();
startTimer();
</script>
