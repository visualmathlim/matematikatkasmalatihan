    "text": "<p>Hasil dari <span class=\"math inline\">$\\frac{3}{4} \\div \\frac{9}{8} - \\frac{1}{6} \\times \\frac{3}{2}$</span> adalah ....</p>",

    "correct": 0,
    "pembahasan": "<p><strong>Konsep:</strong> perkalian dan pembagian dikerjakan lebih dulu daripada penjumlahan/pengurangan. Pembagian pecahan = kali kebalikan.</p>\n<p><strong>Langkah 1 - pembagian</strong></p>\n<p><span class=\"math display\">$$\\frac{3}{4} \\div \\frac{9}{8} = \\frac{3}{4} \\times \\frac{8}{9}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{24}{36} = \\frac{2}{3}$$</span></p>\n<p><strong>Langkah 2 - perkalian</strong></p>\n<p><span class=\"math display\">$$\\frac{1}{6} \\times \\frac{3}{2} = \\frac{3}{12} = \\frac{1}{4}$$</span></p>\n<p><strong>Langkah 3 - pengurangan (KPK 12)</strong></p>\n<p><span class=\"math display\">$$\\frac{2}{3} - \\frac{1}{4} = \\frac{8}{12} - \\frac{3}{12}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{5}{12}$$</span></p>\n<p><strong>Jawaban: A.</strong></p>\n<p><strong>Pola jebakan:</strong> B = mengurangi dulu baru mengalikan, <span class=\"math inline\">$\\left( \\frac{2}{3} - \\frac{1}{6} \\right) \\times \\frac{3}{2}$</span>; C = <span class=\"math inline\">$\\frac{1}{6} \\times \\frac{3}{2}$</span> dihitung <span class=\"math inline\">$\\frac{1}{12}$</span>; D = tanda pengurangan diubah menjadi tambah; E = lupa membalik pecahan pembagi.</p>",
    "cara_cepat": "<p>Ubah <span class=\"math inline\">$\\div$</span> menjadi <span class=\"math inline\">$\\times$</span> kebalikan, lalu <strong>coret silang</strong>: <span class=\"math inline\">$\\frac{3}{4} \\times \\frac{8}{9}$</span> → 3 dengan 9 jadi 1 dan 3, 8 dengan 4 jadi 2 dan 1, hasil <span class=\"math inline\">$\\frac{2}{3}$</span>. Pecahan kedua langsung <span class=\"math inline\">$\\frac{1}{4}$</span>. Selesaikan <span class=\"math inline\">$\\frac{2}{3} - \\frac{1}{4} = \\frac{8 - 3}{12}$</span>.</p>"

  {
    "id": 2,
    "type": "pkg",
    "level": "Sedang",
    "topic": "Bilangan Real (pangkat pecahan)",
    "text": "<p>Diketahui <span class=\"math inline\">$x = 16^{\\frac{3}{4}}$</span>, <span class=\"math inline\">$y = 25^{- \\frac{1}{2}}$</span>, dan <span class=\"math inline\">$z = \\sqrt[3]{64}$</span>.</p><p>Pilihlah <strong>semua</strong> pernyataan yang benar! (Jawaban benar lebih dari satu.)</p>",
    "image": "",
    "options": [
      "<span class=\"math inline\">$x = 8$</span>",
      "<span class=\"math inline\">$y = - 5$</span>",
      "<span class=\"math inline\">$x \\times z = 32$</span>",
      "<span class=\"math inline\">$x \\div z = 4$</span>",
      "<span class=\"math inline\">$x \\times y = \\frac{8}{5}$</span>"
    ],
    "correct": [
      0,
      2,
      4
    ],
    "pembahasan": "<p><strong>Konsep:</strong> <span class=\"math inline\">$a^{\\frac{m}{n}} = \\sqrt[n]{a^{m}}$</span> dan <span class=\"math inline\">$a^{- n} = \\frac{1}{a^{n}}$</span> (pangkat negatif berarti kebalikan, bukan bilangan negatif).</p>\n<p><strong>Nilai x</strong></p>\n<p><span class=\"math display\">$$x = 16^{\\frac{3}{4}} = \\left( 2^{4} \\right)^{\\frac{3}{4}}$$</span></p>\n<p><span class=\"math display\">$$= 2^{3} = 8$$</span></p>\n<p><strong>Nilai y</strong></p>\n<p><span class=\"math display\">$$y = 25^{- \\frac{1}{2}} = \\frac{1}{25^{\\frac{1}{2}}}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{1}{5}$$</span></p>\n<p><strong>Nilai z</strong></p>\n<p><span class=\"math display\">$$z = \\sqrt[3]{64} = 4$$</span></p>\n<p><strong>Periksa tiap pernyataan</strong></p>\n<p>A. <span class=\"math inline\">$x = 8$</span> → <strong>Benar</strong>.</p>\n<p>B. <span class=\"math inline\">$y = - 5$</span> → <strong>Salah</strong>, <span class=\"math inline\">$y = \\frac{1}{5}$</span> (positif).</p>\n<p>C. <span class=\"math inline\">$x \\times z = 8 \\times 4 = 32$</span> → <strong>Benar</strong>.</p>\n<p>D. <span class=\"math inline\">$x \\div z = 8 \\div 4 = 2$</span> → <strong>Salah</strong>.</p>\n<p>E. <span class=\"math inline\">$x \\times y = 8 \\times \\frac{1}{5} = \\frac{8}{5}$</span> → <strong>Benar</strong>.</p>\n<p><strong>Jawaban: A, C, dan E.</strong></p>",
    "cara_cepat": "<p>Ubah ke basis prima dulu: <span class=\"math inline\">$16 = 2^{4}$</span> sehingga <span class=\"math inline\">$\\left( 2^{4} \\right)^{3/4} = 2^{3} = 8$</span>. Ingat <strong>pangkat negatif = kebalikan</strong>, jadi <span class=\"math inline\">$25^{- 1/2} = \\frac{1}{5}$</span>. Setelah <span class=\"math inline\">$x = 8,\\ y = \\frac{1}{5},\\ z = 4$</span>, semua pernyataan dicek dengan satu kali hitung.</p>"
  },
  {
    "id": 3,
    "type": "pg",
    "level": "HOTS",
    "topic": "Bilangan Real (bentuk akar)",
    "text": "<p>Diketahui <span class=\"math inline\">$a = \\frac{3 + \\sqrt{5}}{3 - \\sqrt{5}}$</span>. Nilai dari <span class=\"math inline\">$a + \\frac{1}{a}$</span> adalah ....</p>",
    "image": "",
    "options": [
      "<span class=\"math inline\">$3$</span>",
      "<span class=\"math inline\">$\\frac{7}{2}$</span>",
      "<span class=\"math inline\">$14$</span>",
      "<span class=\"math inline\">$7$</span>",
      "<span class=\"math inline\">$3\\sqrt{5}$</span>"
    ],
    "correct": 3,
    "pembahasan": "<p><strong>Konsep:</strong> merasionalkan penyebut dengan akar sekawan, <span class=\"math inline\">$(p - q)(p + q) = p^{2} - q^{2}$</span>.</p>\n<p><strong>Langkah 1 - rasionalkan</strong> <span class=\"math inline\">$a$</span></p>\n<p><span class=\"math display\">$$a = \\frac{3 + \\sqrt{5}}{3 - \\sqrt{5}} \\times \\frac{3 + \\sqrt{5}}{3 + \\sqrt{5}}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{\\left( 3 + \\sqrt{5} \\right)^{2}}{9 - 5}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{14 + 6\\sqrt{5}}{4} = \\frac{7 + 3\\sqrt{5}}{2}$$</span></p>\n<p><strong>Langkah 2 - cari</strong> <span class=\"math inline\">$\\frac{1}{a}$</span> <strong>(balik pecahan, lalu rasionalkan)</strong></p>\n<p><span class=\"math display\">$$\\frac{1}{a} = \\frac{3 - \\sqrt{5}}{3 + \\sqrt{5}} = \\frac{\\left( 3 - \\sqrt{5} \\right)^{2}}{4}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{14 - 6\\sqrt{5}}{4} = \\frac{7 - 3\\sqrt{5}}{2}$$</span></p>\n<p><strong>Langkah 3 - jumlahkan</strong></p>\n<p><span class=\"math display\">$$a + \\frac{1}{a} = \\frac{7 + 3\\sqrt{5}}{2} + \\frac{7 - 3\\sqrt{5}}{2}$$</span></p>\n<p><span class=\"math display\">$$= \\frac{14}{2} = 7$$</span></p>\n<p><strong>Jawaban: D.</strong></p>\n<p><strong>Pola jebakan:</strong> E = <span class=\"math inline\">$a - \\frac{1}{a}$</span> (salah tanda); C = penyebut <span class=\"math inline\">$9 - 5$</span> ditulis 2 bukan 4; B = hanya bagian rasional dari <span class=\"math inline\">$a$</span>; A = tebakan dari angka 3 pada soal.</p>",
    "cara_cepat": "<p>Gabungkan langsung: <span class=\"math inline\">$a + \\frac{1}{a} = \\frac{\\left( 3 + \\sqrt{5} \\right)^{2} + \\left( 3 - \\sqrt{5} \\right)^{2}}{\\left( 3 + \\sqrt{5} \\right)\\left( 3 - \\sqrt{5} \\right)}$</span>. Penyebut <span class=\"math inline\">$= 9 - 5 = 4$</span>. Pembilang <span class=\"math inline\">$= 2(9 + 5) = 28$</span> (suku akar saling meniadakan). Hasil <span class=\"math inline\">$\\frac{28}{4} = 7$</span>.</p>"
  },
  {
    "id": 4,
    "type": "pg",
    "level": "Sedang",
    "topic": "Persamaan dan Pertidaksamaan Linear (SPLTV)",
    "text": "<p>Di sebuah toko buah, tiga pelanggan berbelanja dengan rincian berikut.</p><div class=\"tbl-wrap\"><table class=\"vm-table\" style=\"width:97%;\">\n\n<thead>\n<tr>\n<th><strong>Pembeli</strong></th>\n<th><strong>Apel</strong></th>\n<th><strong>Jeruk</strong></th>\n<th><strong>Mangga</strong></th>\n<th><strong>Membayar</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ani</td>\n<td>2 kg</td>\n<td>1 kg</td>\n<td>3 kg</td>\n<td>Rp150.000,00</td>\n</tr>\n<tr>\n<td>Budi</td>\n<td>1 kg</td>\n<td>2 kg</td>\n<td>2 kg</td>\n<td>Rp110.000,00</td>\n</tr>\n<tr>\n<td>Citra</td>\n<td>3 kg</td>\n<td>2 kg</td>\n<td>1 kg</td>\n<td>Rp145.000,00</td>\n</tr>\n</tbody>\n</table></div><p>Jika Dewi membeli masing-masing 1 kg apel, 1 kg jeruk, dan 1 kg mangga di toko yang sama, uang yang harus dibayar Dewi adalah ....</p>",
    "image": "",
    "options": [
      "Rp45.000,00",
      "Rp70.000,00",
      "Rp55.000,00",
      "Rp40.000,00",
      "Rp80.000,00"
    ],
    "correct": 1,
    "pembahasan": "<p><strong>Pemisalan</strong> (dalam ribuan rupiah per kg): <span class=\"math inline\">$a$</span> = apel, <span class=\"math inline\">$j$</span> = jeruk, <span class=\"math inline\">$m$</span> = mangga.</p>\n<p><span class=\"math display\">$$2a + j + 3m = 150\\quad\\cdots(1)$$</span></p>\n<p><span class=\"math display\">$$a + 2j + 2m = 110\\quad\\cdots(2)$$</span></p>\n<p><span class=\"math display\">$$3a + 2j + m = 145\\quad\\cdots(3)$$</span></p>\n<p><strong>Langkah 1 - hilangkan</strong> <span class=\"math inline\">$j$</span> <strong>dari (3) dan (2)</strong></p>\n<p><span class=\"math display\">$$(3) - (2):\\quad 2a - m = 35$$</span></p>\n<p><span class=\"math display\">$$m = 2a - 35\\quad\\cdots(4)$$</span></p>\n<p><strong>Langkah 2 - hilangkan</strong> <span class=\"math inline\">$j$</span> <strong>dari (1) dan (2)</strong></p>\n<p><span class=\"math display\">$$2 \\times (1):\\quad 4a + 2j + 6m = 300$$</span></p>\n<p><span class=\"math display\">$$- \\ (2):\\quad 3a + 4m = 190\\quad\\cdots(5)$$</span></p>\n<p><strong>Langkah 3 - substitusi (4) ke (5)</strong></p>\n<p><span class=\"math display\">$$3a + 4(2a - 35) = 190$$</span></p>\n<p><span class=\"math display\">$$11a = 330$$</span></p>\n<p><span class=\"math display\">$$a = 30,\\quad m = 2(30) - 35 = 25$$</span></p>\n<p><strong>Langkah 4 - cari</strong> <span class=\"math inline\">$j$</span> <strong>dari (2)</strong></p>\n<p><span class=\"math display\">$$30 + 2j + 2(25) = 110$$</span></p>\n<p><span class=\"math display\">$$2j = 30 \\Rightarrow j = 15$$</span></p>\n<p><strong>Langkah 5 - jawab yang ditanya</strong></p>\n<p><span class=\"math display\">$$a + j + m = 30 + 15 + 25 = 70$$</span></p>\n<p>Jadi Dewi membayar Rp70.000,00. <strong>Jawaban: B.</strong></p>\n<p><strong>Pola jebakan:</strong> Rp45.000 = apel + jeruk (lupa mangga); Rp55.000 = apel + mangga (lupa jeruk); Rp40.000 = jeruk + mangga (lupa apel); Rp80.000 = dua kali (jeruk + mangga).</p>",
    "cara_cepat": "<p>Kurangkan (3)-(2) agar langsung dapat <span class=\"math inline\">$2a - m = 35$</span>, lalu <span class=\"math inline\">$2 \\times (1) - (2)$</span> dapat <span class=\"math inline\">$3a + 4m = 190$</span>. Dua persamaan ini diselesaikan dengan <span class=\"math inline\">$m = 2a - 35$</span>. Pastikan hasil bulat kelipatan 5.000: <span class=\"math inline\">$a = 30,\\ j = 15,\\ m = 25$</span>. Cek cepat ke (1): <span class=\"math inline\">$60 + 15 + 75 = 150$</span> (cocok).</p>"
  },
  {
    "id": 5,
    "type": "pg",
    "level": "HOTS",
    "topic": "Persamaan dan Pertidaksamaan Linear (Program Linear)",
    "text": "<p>Pak Dedi memiliki modal Rp12.000.000,00 untuk membeli sepatu jenis A seharga Rp200.000,00 per pasang dan jenis B seharga Rp300.000,00 per pasang. Tokonya hanya mampu menampung paling banyak 50 pasang sepatu. Laba tiap pasang sepatu A adalah Rp40.000,00 dan sepatu B adalah Rp50.000,00.</p><p>Jika semua sepatu terjual, laba maksimum yang dapat diperoleh Pak Dedi adalah ....</p>",
    "image": "",
    "options": [
      "Rp2.000.000,00",
      "Rp2.400.000,00",
      "Rp2.500.000,00",
      "Rp2.300.000,00",
      "Rp2.200.000,00"
    ],
    "correct": 4,
    "pembahasan": "<p><strong>Pemisalan:</strong> <span class=\"math inline\">$x$</span> = pasang sepatu A, <span class=\"math inline\">$y$</span> = pasang sepatu B.</p>\n<p><strong>Langkah 1 - model matematika</strong></p>\n<p><span class=\"math display\">$$200.000x + 300.000y \\leq 12.000.000\\; \\Rightarrow \\; 2x + 3y \\leq 120$$</span></p>\n<p><span class=\"math display\">$$x + y \\leq 50,\\quad\\quad x \\geq 0,\\ y \\geq 0$$</span></p>\n<p><span class=\"math display\">$$Z = 40.000x + 50.000y$$</span></p>\n<p><strong>Langkah 2 - titik pojok daerah penyelesaian</strong></p>\n<p>Perpotongan sumbu: <span class=\"math inline\">$(50,0)$</span> dan <span class=\"math inline\">$(0,40)$</span>. Perpotongan dua garis:</p>\n<p><span class=\"math display\">$$2x + 3y = 120$$</span></p>\n<p><span class=\"math display\">$$x + y = 50\\; \\Rightarrow \\; y = 50 - x$$</span></p>\n<p><span class=\"math display\">$$2x + 3(50 - x) = 120$$</span></p>\n<p><span class=\"math display\">$$150 - x = 120 \\Rightarrow x = 30,\\ y = 20$$</span></p>\n<p><strong>Langkah 3 - uji fungsi tujuan</strong></p>\n<div class=\"tbl-wrap\"><table class=\"vm-table\" style=\"width:97%;\">\n\n<thead>\n<tr>\n<th><strong>Titik pojok</strong></th>\n<th><span>\\(Z = 40.000x + 50.000y\\)</span></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>(0, 0)</td>\n<td>Rp0</td>\n</tr>\n<tr>\n<td>(50, 0)</td>\n<td>Rp2.000.000</td>\n</tr>\n<tr>\n<td>(0, 40)</td>\n<td>Rp2.000.000</td>\n</tr>\n<tr>\n<td>(30, 20)</td>\n<td>Rp2.200.000 (terbesar)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Jawaban: E.</strong></p>\n<p><strong>Pola jebakan:</strong> Rp2.400.000 = <span class=\"math inline\">$(60,0)$</span> (abaikan kapasitas 50); Rp2.500.000 = <span class=\"math inline\">$(0,50)$</span> (abaikan modal); Rp2.300.000 = <span class=\"math inline\">$(45,10)$</span> yang memenuhi modal tetapi melanggar kapasitas (<span class=\"math inline\">$45 + 10 = 55$</span>); Rp2.000.000 = titik sumbu.</p>",
    "cara_cepat": "<p>Bandingkan gradien. Fungsi tujuan: <span class=\"math inline\">$- \\frac{40}{50} = - 0,8$</span>. Garis kapasitas: <span class=\"math inline\">$- 1$</span>. Garis modal: <span class=\"math inline\">$- \\frac{2}{3} \\approx - 0,67$</span>. Karena <span class=\"math inline\">$- 1 &lt; - 0,8 &lt; - 0,67$</span>, maksimum pasti di <strong>titik potong kedua garis</strong>, yaitu <span class=\"math inline\">$(30,20)$</span>. Hitung hanya satu titik: <span class=\"math inline\">$40.000(30) + 50.000(20) = 2.200.000$</span>.</p>"
  },
  {
    "id": 6,
    "type": "pg",
    "level": "Sedang",
    "topic": "Fungsi (domain dan daerah hasil fungsi kuadrat)",
    "text": "<p>Fungsi <span class=\"math inline\">$f$</span> didefinisikan dengan <span class=\"math inline\">$f(x) = x^{2} - 4x + 3$</span> untuk domain <span class=\"math inline\">$1 \\leq x \\leq 5$</span>. Daerah hasil (range) fungsi <span class=\"math inline\">$f$</span> adalah ....</p>",
    "image": "",
    "options": [
      "<span class=\"math inline\">$0 \\leq y \\leq 8$</span>",
      "<span class=\"math inline\">$- 1 \\leq y \\leq 0$</span>",
      "<span class=\"math inline\">$- 1 \\leq y \\leq 8$</span>",
      "<span class=\"math inline\">$- 1 \\leq y \\leq 3$</span>",
      "<span class=\"math inline\">$y \\geq - 1$</span>"
    ],
    "correct": 2,
    "pembahasan": "<p><strong>Konsep:</strong> pada domain tertutup, nilai minimum dan maksimum parabola ada di <strong>titik puncak</strong> (jika berada di dalam domain) atau di <strong>ujung domain</strong>.</p>\n<p><strong>Langkah 1 - bentuk kuadrat sempurna</strong></p>\n<p><span class=\"math display\">$$f(x) = x^{2} - 4x + 3 = (x - 2)^{2} - 1$$</span></p>\n<p>Puncak <span class=\"math inline\">$(2, - 1)$</span>; <span class=\"math inline\">$x = 2$</span> berada di dalam <span class=\"math inline\">$\\lbrack 1,5\\rbrack$</span>, parabola terbuka ke atas, jadi nilai minimum <span class=\"math inline\">$= - 1$</span>.</p>\n<p><strong>Langkah 2 - nilai di ujung domain</strong></p>\n<p><span class=\"math display\">$$f(1) = 1 - 4 + 3 = 0$$</span></p>\n<p><span class=\"math display\">$$f(5) = 25 - 20 + 3 = 8$$</span></p>\n<p><strong>Langkah 3 - tentukan range</strong></p>\n<p><span class=\"math display\">$$\\text{minimum} = - 1,\\quad\\text{maksimum} = 8$$</span></p>\n<p><span class=\"math display\">$$R_{f} = \\{\\, y \\mid - 1 \\leq y \\leq 8\\,\\}$$</span></p>\n<p><strong>Jawaban: C.</strong></p>\n<p><strong>Pola jebakan:</strong> A = mengabaikan titik puncak (hanya melihat ujung 0 dan 8); B = memakai <span class=\"math inline\">$f(1) = 0$</span> dan puncak; D = memakai domain <span class=\"math inline\">$0 \\leq x \\leq 4$</span> (nilai ujung 3); E = lupa membatasi domain.</p>",
    "cara_cepat": "<p>Cari sumbu simetri <span class=\"math inline\">$x = - \\frac{b}{2a} = 2$</span>. Karena 2 di dalam [1, 5], minimum = <span class=\"math inline\">$f(2) = - 1$</span>. Maksimum ada di ujung yang <strong>paling jauh dari sumbu simetri</strong>, yaitu <span class=\"math inline\">$x = 5$</span> (jarak 3, sedangkan <span class=\"math inline\">$x = 1$</span> berjarak 1): <span class=\"math inline\">$f(5) = 8$</span>.</p>"
  },
  {
    "id": 7,

    "topic": "Fungsi (invers dan komposisi fungsi)",
    "text": "<p>Diketahui fungsi <span class=\"math inline\">$f(x) = \\frac{2x + 1}{x - 3}$</span> dengan <span class=\"math inline\">$x \\neq 3$</span> dan <span class=\"math inline\">$g(x) = x + 2$</span>. Nilai dari <span class=\"math inline\">$(g \\circ f)^{- 1}(5)$</span> adalah ....</p>",
    "image": "",

ajar. Dua garis tak sebidang yang tidak berpotongan disebut <strong>bersilangan</strong>.</p>",

<script>
const TOTAL=questions.length,DURATION=3600,KEY='vm_tryout_paket4_v1',L=['A','B','C','D','E'];
const WRAP='flex flex-col gap-4 overflow-hidden break-words';
const IMG='max-w-full h-auto object-contain block mx-auto rounded-lg border border-gray-600 bg-white/10 p-2 my-3';
let cur=0,answers={},endAt=0,submitted=false,timerId=null;
const $=s=>document.querySelector(s);
const TYPE={pg:'Pilihan Ganda',pkg:'Pilihan Ganda Kompleks',bs:'Benar / Salah'};
const HINT={pg:'Pilih satu jawaban yang paling tepat.',pkg:'Pilih semua pernyataan yang benar (boleh lebih dari satu).',bs:'Tentukan Benar atau Salah untuk setiap pernyataan.'};
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,endAt,cur}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.endAt>Date.now()){answers=d.answers||{};endAt=d.endAt;cur=Math.min(d.cur||0,TOTAL-1);return true}}catch(e){}return false}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function isAnswered(q){const a=answers[q.id];if(a==null)return false;if(q.type==='pg')return true;if(q.type==='pkg')return a.length>0;return a.some(v=>v!==null)}
function isCorrect(q){const a=answers[q.id];if(!isAnswered(q))return false;if(q.type==='pg')return a===q.correct;if(q.type==='pkg')return a.length===q.correct.length&&q.correct.every(i=>a.includes(i));return q.correct.every((v,i)=>a[i]===v)}
function typeset(root,n=0){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([root]).catch(()=>{})}else if(n<60)setTimeout(()=>typeset(root,n+1),250)}
const fmt=s=>String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const crumbs=`<nav class="flex items-center gap-2 text-xs sm:text-sm text-gray-300">
<a href="index.html" class="hover:text-vcyan"><i class="fa-solid fa-house"></i> Home</a><i class="fa-solid fa-chevron-right text-[10px]"></i>
<a href="tryout.html" class="hover:text-vcyan">Dashboard Tryout</a></nav>`;
const brand=`<div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 min-w-0"><div class="flex items-center gap-2">
<img src="logo.png" alt="" class="h-9 w-9 object-contain" onerror="this.style.display='none'"><span class="font-extrabold text-lg">VisualMath<span class="text-vcyan">.Lim</span></span></div>${crumbs}</div>`;
function imgFail(el,id){el.onerror=null;if(typeof imageFallback!=='undefined'&&imageFallback[id])el.src=imageFallback[id];else el.remove()}
function body(q){return `<div class="${WRAP}"><div class="prose-vm">${q.text}</div>${q.image?`<img src="${q.image}" alt="Gambar soal ${q.id}" class="${IMG}" onerror="imgFail(this,${q.id})">`:''}</div>`}
/* ---------- UJIAN ---------- */
function renderShell(){
$('#app').innerHTML=`<header class="sticky top-0 z-40 bg-[#011638]/95 backdrop-blur border-b border-vcyan/30"><div class="max-w-[1400px] mx-auto px-3 py-2 flex flex-wrap items-center justify-between gap-2">
${brand}<div class="order-last sm:order-none w-full sm:w-auto flex justify-center"><div class="px-4 py-1.5 rounded-lg border border-vcyan/60 shadow-[0_0_12px_#00d6d8aa] font-mono text-xl font-bold text-vcyan"><i class="fa-regular fa-clock mr-2"></i><span id="timer">01:00:00</span></div></div>
<button data-act="end" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 font-semibold text-sm"><i class="fa-solid fa-flag-checkered mr-1"></i>Akhiri Ujian</button></div></header>
<main class="max-w-[1400px] mx-auto p-3 lg:p-6 flex flex-col lg:flex-row gap-4"><section id="qArea" class="w-full lg:w-3/4 min-w-0"></section>
<aside class="w-full lg:w-1/4"><div class="lg:sticky lg:top-24 rounded-xl bg-white/5 border border-vcyan/30 p-3"><div class="flex justify-between text-sm mb-2"><span class="font-semibold">Navigasi Soal</span><span id="prog" class="text-vcyan"></span></div>
<div id="nav" class="navscroll flex lg:grid lg:grid-cols-5 gap-2 overflow-x-auto lg:overflow-visible pb-2"></div></div></aside></main><div id="modal"></div>`}
function renderNav(){
$('#nav').innerHTML=questions.map((q,i)=>{const a=isAnswered(q),on=i===cur;
const c=a?'bg-vyellow text-black font-bold':'bg-white/10 text-white hover:bg-white/20';
return `<button data-act="go" data-i="${i}" class="shrink-0 w-11 h-11 lg:w-full lg:h-11 rounded-lg ${c} ${on?'ring-2 ring-vcyan shadow-[0_0_10px_#00d6d8]':''}">${i+1}</button>`}).join('');
$('#prog').textContent=questions.filter(isAnswered).length+'/'+TOTAL+' terjawab';
const b=$('#nav').children[cur];if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})}
function renderQ(){
const q=questions[cur],a=answers[q.id];let opts='';
if(q.type==='pg'||q.type==='pkg'){opts=q.options.map((o,i)=>{const sel=q.type==='pg'?a===i:(a||[]).includes(i);
const mark=q.type==='pg'?`<span class="mt-1 w-5 h-5 shrink-0 rounded-full border-2 ${sel?'border-vcyan':'border-gray-400'} flex items-center justify-center">${sel?'<span class="w-2.5 h-2.5 rounded-full bg-vcyan"></span>':''}</span>`
:`<span class="mt-1 w-5 h-5 shrink-0 rounded border-2 ${sel?'border-vcyan bg-vcyan text-navy':'border-gray-400'} flex items-center justify-center text-xs">${sel?'<i class="fa-solid fa-check"></i>':''}</span>`;
return `<button data-act="${q.type}" data-i="${i}" class="w-full text-left flex items-start gap-3 p-3 rounded-lg border transition ${sel?'bg-vcyan/20 border-vcyan':'border-white/20 hover:bg-white/10 hover:border-vcyan/60'}">${mark}<span class="font-bold w-5 shrink-0">${L[i]}.</span><span class="min-w-0 break-words">${o}</span></button>`}).join('')}
else{opts=q.options.map((o,i)=>{const v=a?a[i]:null;const b=(val,t)=>`<button data-act="bs" data-i="${i}" data-v="${val}" class="px-4 py-2 rounded-lg border text-sm font-semibold ${v===!!val&&v!==null?'bg-vcyan/20 border-vcyan text-vcyan':'border-white/25 hover:bg-white/10'}">${t}</button>`;
return `<div class="p-3 rounded-lg border border-white/20 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex gap-3 flex-1 min-w-0"><span class="font-bold">${L[i]}.</span><span class="break-words min-w-0">${o}</span></div><div class="flex gap-2 shrink-0">${b(1,'Benar')}${b(0,'Salah')}</div></div>`}).join('')}
const last=cur===TOTAL-1;
$('#qArea').innerHTML=`<div class="rounded-xl bg-white/5 border border-vcyan/30 p-4 lg:p-6"><div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xl font-extrabold text-vcyan">Soal ${cur+1}<span class="text-gray-400 text-base"> / ${TOTAL}</span></span>
<span class="text-xs px-2 py-1 rounded bg-vcyan/20 text-vcyan">${TYPE[q.type]}</span><span class="text-xs px-2 py-1 rounded bg-white/10">${q.level}</span><span class="text-xs px-2 py-1 rounded bg-white/10">${q.topic}</span></div>
${body(q)}<p class="text-sm text-vcyan/80 mt-4 mb-2"><i class="fa-regular fa-lightbulb mr-1"></i>${HINT[q.type]}</p><div class="flex flex-col gap-2">${opts}</div>
<div class="flex justify-between gap-3 mt-6"><button data-act="prev" ${cur===0?'disabled':''} class="px-5 py-2.5 rounded-lg border border-vcyan/60 hover:bg-vcyan/20 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-arrow-left mr-1"></i>Sebelumnya</button>
${last?`<button data-act="end" class="px-5 py-2.5 rounded-lg bg-vyellow text-black font-bold hover:brightness-110">Submit &amp; Lihat Pembahasan</button>`:`<button data-act="next" class="px-5 py-2.5 rounded-lg bg-vcyan text-navy font-semibold hover:brightness-110">Selanjutnya<i class="fa-solid fa-arrow-right ml-1"></i></button>`}</div></div>`;
typeset($('#qArea'))}
function refresh(){renderNav();renderQ();save()}
function tick(){const s=Math.max(0,Math.round((endAt-Date.now())/1000));const t=$('#timer');if(t){t.textContent=fmt(s);t.parentElement.classList.toggle('text-red-400',s<300)}if(s<=0)finish()}
function confirmEnd(){const un=TOTAL-questions.filter(isAnswered).length;
$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4"><div class="bg-navy border border-vcyan rounded-xl p-6 max-w-md w-full shadow-[0_0_25px_#00d6d8aa]"><h3 class="text-xl font-bold mb-2">Akhiri ujian?</h3>
<p class="text-gray-300 mb-5">${un>0?`Masih ada <b class="text-vyellow">${un} soal</b> yang belum dijawab. `:'Semua soal sudah dijawab. '}Setelah diakhiri, jawaban tidak dapat diubah.</p>
<div class="flex gap-3 justify-end"><button data-act="cancel" class="px-4 py-2 rounded-lg border border-white/30 hover:bg-white/10">Lanjut Mengerjakan</button><button data-act="yes" class="px-4 py-2 rounded-lg bg-vyellow text-black font-bold">Ya, Akhiri</button></div></div></div>`}
/* ---------- PEMBAHASAN ---------- */
function ansText(q,i){return `<span class="font-bold">${L[i]}.</span> ${q.options[i]}`}
function reviewOpts(q){const a=answers[q.id];
if(q.type==='bs')return q.options.map((o,i)=>{const v=a?a[i]:null,k=q.correct[i],ok=v===k;
return `<div class="p-3 rounded-lg border ${ok?'border-green-400 bg-green-500/15':'border-red-400 bg-red-500/15'}"><div class="flex gap-2"><b>${L[i]}.</b><span class="min-w-0 break-words">${o}</span></div>
<div class="text-sm mt-1">Jawabanmu: <b>${v===null?'Kosong':v?'Benar':'Salah'}</b> &nbsp;|&nbsp; Kunci: <b class="text-green-300">${k?'Benar':'Salah'}</b></div></div>`}).join('');
return q.options.map((o,i)=>{const key=q.type==='pg'?q.correct===i:q.correct.includes(i),ch=q.type==='pg'?a===i:(a||[]).includes(i);
const cls=key?'border-green-400 bg-green-500/15':ch?'border-red-400 bg-red-500/15':'border-white/15';
const tag=key&&ch?'✓ Jawabanmu = kunci':key?'✓ Kunci':ch?'✗ Jawabanmu':'';
return `<div class="p-3 rounded-lg border ${cls} flex gap-2 items-start"><b>${L[i]}.</b><span class="min-w-0 break-words flex-1">${o}</span>${tag?`<span class="text-xs font-semibold shrink-0 ${key?'text-green-300':'text-red-300'}">${tag}</span>`:''}</div>`}).join('')}
function keyText(q){return q.type==='pg'?L[q.correct]:q.type==='pkg'?q.correct.map(i=>L[i]).join(', '):q.correct.map((v,i)=>L[i]+'='+(v?'Benar':'Salah')).join('; ')}
function ansLabel(q){const a=answers[q.id];if(!isAnswered(q))return 'Kosong';return q.type==='pg'?L[a]:q.type==='pkg'?a.map(i=>L[i]).join(', '):a.map((v,i)=>L[i]+'='+(v===null?'-':v?'Benar':'Salah')).join('; ')}
function finish(){if(submitted)return;submitted=true;clearInterval(timerId);clearSave();
const ok=questions.filter(isCorrect).length,blank=questions.filter(q=>!isAnswered(q)).length,wrong=TOTAL-ok-blank,score=Math.round(ok/TOTAL*100);
$('#app').innerHTML=`<header class="sticky top-0 z-40 bg-[#011638]/95 backdrop-blur border-b border-vcyan/30"><div class="max-w-5xl mx-auto px-3 py-2">${brand}</div></header>
<main class="max-w-5xl mx-auto p-3 lg:p-6"><section class="rounded-2xl border border-vcyan bg-gradient-to-br from-vcyan/20 to-white/5 p-6 text-center shadow-[0_0_25px_#00d6d855]">
<p class="text-vcyan font-semibold tracking-wide">HASIL TRYOUT PAKET 4</p><div class="text-6xl font-extrabold my-2 text-vyellow">${score}</div><p class="text-gray-300 mb-5">Skor Akhir (0–100)</p>
<div class="grid grid-cols-3 gap-3 max-w-xl mx-auto mb-6"><div class="rounded-lg bg-green-500/20 p-3"><div class="text-2xl font-bold text-green-300">${ok}</div><div class="text-xs">Total Benar</div></div>
<div class="rounded-lg bg-red-500/20 p-3"><div class="text-2xl font-bold text-red-300">${wrong}</div><div class="text-xs">Total Salah</div></div><div class="rounded-lg bg-white/10 p-3"><div class="text-2xl font-bold">${blank}</div><div class="text-xs">Kosong</div></div></div>
<a href="tryout.html" class="inline-block px-8 py-4 rounded-xl bg-vyellow text-black font-extrabold text-lg hover:brightness-110"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali ke Dashboard</a>
<p class="text-xs text-gray-400 mt-4">Soal pilihan ganda kompleks dan Benar/Salah dianggap benar hanya jika seluruh pilihan tepat.</p></section>
<h2 class="text-2xl font-bold mt-8 mb-4">Pembahasan Lengkap</h2><div id="review" class="flex flex-col gap-6">${questions.map((q,idx)=>{const c=isCorrect(q),b=!isAnswered(q);
const st=c?['bg-green-500','Benar']:b?['bg-gray-500','Kosong']:['bg-red-500','Salah'];
return `<article class="min-w-0 rounded-xl bg-white/5 border border-white/15 p-4 lg:p-6"><div class="flex flex-wrap items-center gap-2 mb-4"><span class="text-xl font-extrabold text-vcyan">Soal ${q.id}</span><span class="text-xs px-2 py-1 rounded ${st[0]}">${st[1]}</span>
<span class="text-xs px-2 py-1 rounded bg-white/10">${TYPE[q.type]}</span><span class="text-xs px-2 py-1 rounded bg-white/10">${q.level}</span><span class="text-xs px-2 py-1 rounded bg-white/10">${q.topic}</span></div>${body(q)}
<div class="flex flex-col gap-2 mt-4">${reviewOpts(q)}</div>
<div class="mt-3 text-sm flex flex-wrap gap-x-6 gap-y-1"><span>Jawabanmu: <b class="${c?'text-green-300':'text-red-300'}">${ansLabel(q)}</b></span><span>Kunci: <b class="text-green-300">${keyText(q)}</b></span></div>
<div class="mt-4 rounded-lg border border-vcyan/50 bg-navy/60 p-4"><h4 class="font-bold text-vcyan mb-2"><i class="fa-solid fa-book-open mr-2"></i>Pembahasan Lengkap</h4><div class="prose-vm">${q.pembahasan}</div></div>
<div class="mt-4 rounded-lg border border-vcyan/40 bg-vcyan/10 p-4"><h4 class="font-bold text-vyellow mb-2">🔥 Cara Cepat</h4><div class="prose-vm">${q.cara_cepat}</div></div></article>`}).join('')}</div>
<div class="text-center my-10"><a href="tryout.html" class="inline-block px-8 py-4 rounded-xl bg-vyellow text-black font-extrabold text-lg hover:brightness-110">Kembali ke Dashboard</a></div></main>`;
window.scrollTo(0,0);typeset($('#review'))}
/* ---------- EVENT & START ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||submitted)return;const act=t.dataset.act,i=+t.dataset.i,q=questions[cur];
if(act==='pg')answers[q.id]=i;
else if(act==='pkg'){const s=new Set(answers[q.id]||[]);s.has(i)?s.delete(i):s.add(i);answers[q.id]=[...s].sort((a,b)=>a-b)}
else if(act==='bs'){const a=answers[q.id]||q.options.map(()=>null);a[i]=t.dataset.v==='1';answers[q.id]=a}
else if(act==='go')cur=i;else if(act==='prev')cur=Math.max(0,cur-1);else if(act==='next')cur=Math.min(TOTAL-1,cur+1);
else if(act==='end'){confirmEnd();return}else if(act==='cancel'){$('#modal').innerHTML='';return}else if(act==='yes'){finish();return}
refresh();if(['go','prev','next'].includes(act))window.scrollTo({top:0,behavior:'smooth'})});
(function start(){if(!load())endAt=Date.now()+DURATION*1000;renderShell();refresh();tick();timerId=setInterval(tick,1000)})();
</script>
</body>
</html>
